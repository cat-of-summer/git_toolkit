name: grabber

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source git repository: URL, owner/repo or self. Empty = the server (or this repository when source_ref is set).'
        required: false
        type: string
        default: ''
      source_ref:
        description: 'Source branch, tag or commit. Empty = default branch of the source.'
        required: false
        type: string
        default: ''
      source_path:
        description: 'Subdirectory inside the source repository. Empty = repository root.'
        required: false
        type: string
        default: ''
      commits:
        description: 'Comma-separated commits to grab files from. Empty = grab everything.'
        required: false
        type: string
        default: ''
      deploy_mirror:
        description: 'Deletions: false = keep all, true = delete files missing in the source.'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: write

jobs:
  grabber:
    uses: cat-of-summer/git_toolkit/.github/workflows/grabber.yml@main
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      PAT_USER: ${{ secrets.PAT_USER }}
      PAT_PASSWORD: ${{ secrets.PAT_PASSWORD }}
    with:
      source_repo: ${{ inputs.source_repo }}
      source_ref: ${{ inputs.source_ref }}
      source_path: ${{ inputs.source_path }}
      commits: ${{ inputs.commits }}
      deploy_mirror: ${{ inputs.deploy_mirror }}
