      DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || './Dockerfile' }}
      BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT || '.' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref_name }}
          submodules: recursive

      - name: Download workspace
        id: workspace
        if: ${{ needs.resolve-config.outputs.run_ci == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: workspace-*
          merge-multiple: true
          path: ${{ runner.temp }}/workspace

      - name: Unpack workspace
        if: ${{ steps.workspace.outcome == 'success' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tars=( "$RUNNER_TEMP"/workspace/workspace-*.tar )
          if [ ${#tars[@]} -eq 0 ]; then
            echo "::error::Artifact workspace-* contains no workspace-*.tar." >&2
            exit 1
          fi
          for t in "${tars[@]}"; do
            echo "Unpacking $(basename "$t")"
            tar -xf "$t" -C .
          done
          rm -rf "$RUNNER_TEMP/workspace"

      - name: Resolve image
        id: meta
        env:
          SUFFIX: ${{ needs.resolve-ref.outputs.pkg_suffix }}
          BRANCH: ${{ needs.resolve-ref.outputs.environment }}
          TAG: ${{ needs.resolve-ref.outputs.ref_tag }}
        run: |
          set -euo pipefail

          if [ ! -f "$DOCKERFILE_PATH" ]; then
            echo "::error::Dockerfile not found at '$DOCKERFILE_PATH'. The docker publish method requires a Dockerfile (set DOCKERFILE_PATH to override the default ./Dockerfile)." >&2
            exit 1
          fi

          IMG="${DOCKER_IMAGE}${SUFFIX}"
          IMAGE="$(echo "${DOCKER_REGISTRY}/${IMG}" | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$TAG" =~ ^v?([0-9]+(\.[0-9]+)*)$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag (expected v#, v#.#, v#.#.#)." >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"

          echo "Image: $IMAGE"
          echo "Version: $VERSION"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:latest"
            if [ -z "$SUFFIX" ]; then
              echo "${IMAGE}:${BRANCH}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            PAT_TOKEN=${{ secrets.PAT_TOKEN }}
            VERSION=${{ steps.meta.outputs.sha_short }}
            ENVIRONMENT=${{ needs.resolve-ref.outputs.environment }}
            ${{ vars.DOCKER_BUILD_ARGS }}

  packagist-publish:
    needs: [resolve-ref, resolve-config, release-publish]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.run_release == 'true' && needs.resolve-config.outputs.publish_method == 'packagist' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-ref.outputs.environment }}

    steps:
      - name: Publish to Packagist
        env:
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail

          # Update the package; create it when Packagist does not know it yet (first publish).
          update_code=$(curl -sS -o /tmp/packagist.out -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d "{\"repository\":{\"url\":\"${REPO_URL}\"}}")

          if [ "$update_code" -ge 200 ] && [ "$update_code" -lt 300 ]; then
            echo "Packagist: package updated."
            cat /tmp/packagist.out; echo
            exit 0
          fi

          if [ "$update_code" != "404" ]; then
            echo "::error::Packagist update failed (HTTP $update_code)."
            cat /tmp/packagist.out; echo
            exit 1
          fi

          echo "Packagist: package not found, creating it (first publish)…"
          create_code=$(curl -sS -o /tmp/packagist.out -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            https://packagist.org/api/create-package \
            -d "{\"repository\":\"${REPO_URL}\"}")

          if [ "$create_code" -ge 200 ] && [ "$create_code" -lt 300 ]; then
            echo "Packagist: package created."
            cat /tmp/packagist.out; echo
          else
            echo "::error::Packagist create failed (HTTP $create_code) — a MAIN API token is required."
            cat /tmp/packagist.out; echo
            exit 1
          fi

  cd:
    needs: [resolve-ref, resolve-config, ci, release-publish, npm-publish, docker-publish, packagist-publish]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.run_cd == 'true' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-ref.outputs.environment }}

    permissions:
      contents: read
      packages: read

    env:
      REF_TYPE: ${{ needs.resolve-ref.outputs.ref_type }}
      REF_NAME: ${{ needs.resolve-ref.outputs.ref_name }}
      REF_NAME_NORM: ${{ needs.resolve-ref.outputs.ref_name_norm }}
      REF_BRANCH: ${{ needs.resolve-ref.outputs.ref_branch }}
      REF_COMMIT: ${{ needs.resolve-ref.outputs.ref_commit }}
      PUBLISHED_IMAGE_TAG: ${{ needs.docker-publish.outputs.tag }}
      PUBLISHED_IMAGE: ${{ needs.docker-publish.outputs.image != '' && format('{0}:{1}', needs.docker-publish.outputs.image, needs.docker-publish.outputs.tag) || '' }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_LOCAL_DIR: ${{ vars.DEPLOY_LOCAL_DIR || './' }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_MIRROR: ${{ needs.resolve-config.outputs.deploy_mirror }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_METHOD: ${{ needs.resolve-config.outputs.deploy_method }}
      APT_PACKAGES: ${{ needs.resolve-config.outputs.apt_packages }}
      BUILD_COMMAND: ${{ vars.BUILD_COMMAND }}
      BEFORE_DEPLOY_COMMAND: ${{ vars.BEFORE_DEPLOY_COMMAND }}
      AFTER_DEPLOY_COMMAND: ${{ vars.AFTER_DEPLOY_COMMAND }}
      SCOPE: ${{ needs.resolve-config.outputs.scope }}
      COMMITS: ${{ needs.resolve-config.outputs.commits }}
      RUN_CI: ${{ needs.resolve-config.outputs.run_ci }}
      LK_TRANSPORT: ${{ needs.resolve-config.outputs.deploy_method == 'ftp' && 'ftp' || 'ssh' }}
      LK_BEAT: '15'
      LK_STALE: '90'
      LK_MAX_HOLD: '11400'
      LK_WAIT: '14400'
      LK_SSH_TARGET: ${{ format('{0}@{1}', vars.DEPLOY_USER, vars.DEPLOY_HOST) }}
      LK_FTP_HOST: ${{ vars.DEPLOY_HOST }}
      LK_FTP_PORT: ${{ vars.DEPLOY_PORT || '21' }}
      LK_FTP_USER: ${{ vars.DEPLOY_USER }}
      LK_FTP_PASS: ${{ secrets.DEPLOY_KEY }}
      LK_REPO: ${{ github.repository }}
      LK_WORKFLOW: ${{ github.workflow_ref }}
      LK_ENVIRONMENT: ${{ needs.resolve-ref.outputs.environment }}
      LK_RUN_ID: ${{ github.run_id }}
      LK_RUN_NUMBER: ${{ github.run_number }}
      LK_RUN_ATTEMPT: ${{ github.run_attempt }}
      LK_RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      LK_COMMIT: ${{ needs.resolve-ref.outputs.ref_commit }}
      LK_ACTOR: ${{ github.actor }}
      LK_DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      LK_METHOD: ${{ needs.resolve-config.outputs.deploy_method }}
      LK_SCOPE: ${{ needs.resolve-config.outputs.scope }}
      DEPLOY_LOCK_DIR: ${{ vars.DEPLOY_LOCK_DIR }}

    steps:
      - name: Collect vars and secrets
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          EXTRA_SECRETS: ${{ secrets.SECRETS_JSON }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/collect-ctx.sh
          # Writes vars and secrets of the job into a sourceable file and exports CTX_ENV with
          # its path, so user commands see them as ordinary environment variables.
          # Inputs: VARS_JSON, EXTRA_SECRETS (SECRETS_JSON, masked), ALL_SECRETS.
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp="$(cygpath -u "$RUNNER_TEMP")"; fi
          CTX="$tmp/ctx_env.sh"
          : > "$CTX"
          chmod 600 "$CTX"

          DENY='^(PATH|HOME|IFS|PWD|OLDPWD|SHELL|SHELLOPTS|PS[0-9]|BASH.*|LD_.*|GITHUB_.*|RUNNER_.*|ACTIONS_.*|TMP_KEY|GT_SSH|GT_AUTH_MODE|CTX|CTX_ENV|GIT_ASKPASS|GIT_CONFIG.*|GIT_TERMINAL_PROMPT|GIT_AUTH_TOKEN.*|VARS_JSON|ALL_SECRETS|EXTRA_SECRETS|github_token|REF_TYPE|REF_NAME|REF_NAME_NORM|REF_BRANCH|REF_COMMIT|TARGET_COMMIT|PUBLISHED_IMAGE|PUBLISHED_IMAGE_TAG|WARM_CACHE)$'

          emit() {
            local json="$1" mask="$2" label="$3"
            local names="" k b64 v

            if [ -z "$json" ] || [ "$json" = "null" ] || [ "$json" = "{}" ]; then
              echo "$label: <none>"
              return 0
            fi
            if ! printf '%s' "$json" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::$label is not a JSON object. Expected {\"NAME\":\"value\", ...}." >&2
              exit 1
            fi

            while IFS=$'\t' read -r k b64; do
              [ -z "$k" ] && continue
              case "$k" in [A-Za-z_][A-Za-z0-9_]*) ;; *) continue ;; esac
              if printf '%s' "$k" | grep -qE "$DENY"; then continue; fi
              v="$(printf '%s' "$b64" | base64 -d)"
              if [ "$mask" = "mask" ] && [ -n "$v" ]; then
                printf '%s\n' "$v" | while IFS= read -r line; do
                  [ -n "$line" ] && printf '::add-mask::%s\n' "$line"
                done
              fi
              printf 'export %s=%q\n' "$k" "$v" >> "$CTX"
              names="$names $k"
            done < <(printf '%s' "$json" \
              | jq -r 'to_entries[] | .key + "\t" + (.value | tostring | @base64)' \
              | tr -d '\r')

            echo "$label:${names:- <none>}"
          }

          emit "${VARS_JSON:-}"     nomask "vars"
          emit "${EXTRA_SECRETS:-}" mask   "SECRETS_JSON"
          emit "${ALL_SECRETS:-}"   nomask "secrets"

          echo "CTX_ENV=$CTX" >> "$GITHUB_ENV"

          unset -f emit
          unset tmp CTX DENY
          # <<< .github/snippets/collect-ctx.sh

      - name: Cache system packages
        id: cache-apt
        if: ${{ env.APT_PACKAGES != '' }}
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ env.APT_PACKAGES }}-v3

      - name: Install system packages
        if: ${{ env.APT_PACKAGES != '' }}
        env:
          CACHE_HIT: ${{ steps.cache-apt.outputs.cache-hit }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/apt-install.sh
          read -r -a __pkgs <<< "${APT_PACKAGES:-}"

          __missing=()
          for __p in "${__pkgs[@]}"; do
            command -v "$__p" >/dev/null 2>&1 || __missing+=("$__p")
          done

          if [ "${#__missing[@]}" -eq 0 ]; then
            echo "System packages already present: ${__pkgs[*]:-<none>}"
          else
            # Keep downloaded .deb files so the apt cache step has something to save.
            echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-cache >/dev/null

            __debs=()
            for __p in "${__missing[@]}"; do
              for __d in /var/cache/apt/archives/"${__p}"_*.deb; do
                [ -f "$__d" ] && __debs+=("$__d")
              done
            done

            if [ "${CACHE_HIT:-}" = "true" ] && [ "${#__debs[@]}" -ge "${#__missing[@]}" ]; then
              echo "Installing from the apt cache: ${__missing[*]}"
              sudo dpkg -i "${__debs[@]}" || sudo apt-get install -f -y --no-install-recommends
            else
              echo "Installing: ${__missing[*]}"
              sudo apt-get update -q
              sudo apt-get install -y --no-install-recommends "${__missing[@]}"
            fi
          fi

          unset __pkgs __missing __p __debs __d
          # <<< .github/snippets/apt-install.sh

      - name: Set up SSH access
        if: ${{ env.DEPLOY_METHOD != 'ftp' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/ssh-auth.sh
          TMP_KEY=$(mktemp)
          printf '%s\n' "$DEPLOY_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"
          echo "TMP_KEY=$TMP_KEY" >> "$GITHUB_ENV"

          GT_SSH="$RUNNER_TEMP/gt-ssh"
          GT_AUTH_MODE=""
          SSH_COMMON=(-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          IS_PEM=0
          case "$(head -n 1 "$TMP_KEY")" in
            -----BEGIN*) IS_PEM=1 ;;
          esac

          if [ "$IS_PEM" = 0 ]; then
            if ! command -v sshpass >/dev/null 2>&1; then
              echo "::error::DEPLOY_KEY is not a PEM private key, so it is used as a password, but sshpass is not installed (step 'Install system packages' should have done it)." >&2
              exit 1
            fi
            echo "SSH auth: probing password..."
            if sshpass -f "$TMP_KEY" ssh \
                 -o PreferredAuthentications=password -o PubkeyAuthentication=no \
                 -o NumberOfPasswordPrompts=1 "${SSH_COMMON[@]}" \
                 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" true \
                 2> "$RUNNER_TEMP/ssh_probe_password.log"; then
              GT_AUTH_MODE=password
            fi
          fi

          if [ -z "$GT_AUTH_MODE" ]; then
            echo "SSH auth: probing private key..."
            if ssh -i "$TMP_KEY" \
                 -o PreferredAuthentications=publickey -o IdentitiesOnly=yes -o BatchMode=yes \
                 "${SSH_COMMON[@]}" \
                 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" true \
                 2> "$RUNNER_TEMP/ssh_probe_key.log"; then
              GT_AUTH_MODE=key
            fi
          fi

          if [ -z "$GT_AUTH_MODE" ]; then
            echo "::error::Cannot authenticate to $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT — DEPLOY_KEY was tried both as a password and as a private key."
            for f in "$RUNNER_TEMP/ssh_probe_password.log" "$RUNNER_TEMP/ssh_probe_key.log"; do
              if [ -s "$f" ]; then echo "=== $(basename "$f") ==="; cat "$f"; fi
            done
            exit 1
          fi

          if [ "$GT_AUTH_MODE" = password ]; then
            {
              echo '#!/usr/bin/env bash'
              printf 'exec sshpass -f %q ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 %s -p %q "$@"\n' \
                "$TMP_KEY" "${SSH_COMMON[*]}" "$DEPLOY_PORT"
            } > "$GT_SSH"
          else
            {
              echo '#!/usr/bin/env bash'
              printf 'exec ssh -i %q -o PreferredAuthentications=publickey -o IdentitiesOnly=yes -o BatchMode=yes %s -p %q "$@"\n' \
                "$TMP_KEY" "${SSH_COMMON[*]}" "$DEPLOY_PORT"
            } > "$GT_SSH"
          fi
          chmod 700 "$GT_SSH"

          echo "GT_SSH=$GT_SSH" >> "$GITHUB_ENV"
          echo "GT_AUTH_MODE=$GT_AUTH_MODE" >> "$GITHUB_ENV"
          echo "SSH auth: using $GT_AUTH_MODE"
          # <<< .github/snippets/ssh-auth.sh

          # Remote prelude: sourced by the remote scripts of before/after commands and git deploy.
          PRELUDE="$RUNNER_TEMP/remote_prelude.sh"
          : > "$PRELUDE"
          chmod 600 "$PRELUDE"

          {
            printf 'export GIT_AUTH_TOKEN_GH=%q\n'  "$GH_TOKEN"
            printf 'export GIT_AUTH_TOKEN_PAT=%q\n' "${PAT_TOKEN:-}"
            cat <<'PRELUDE_GIT'
          __gt_askpass="$(mktemp)"
          chmod 700 "$__gt_askpass"
          printf '%s\n' '#!/bin/sh' 'case "$1" in Username*) echo x-access-token ;; *) echo "$GIT_AUTH_TOKEN" ;; esac' > "$__gt_askpass"
          export __GT_ASKPASS="$__gt_askpass"
          trap 'rm -f "$__gt_askpass"' EXIT

          git_use_token() {
            export GIT_AUTH_TOKEN="$1"
            export GIT_ASKPASS="$__GT_ASKPASS"
            export GIT_TERMINAL_PROMPT=0
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0='url.https://github.com/.insteadOf'
            export GIT_CONFIG_VALUE_0='git@github.com:'
            export GIT_CONFIG_KEY_1='url.https://github.com/.insteadOf'
            export GIT_CONFIG_VALUE_1='ssh://git@github.com/'
          }

          __GT_SSH_OK=0
          if command -v ssh >/dev/null 2>&1; then
            if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 \
                   git@github.com 2>&1 | grep -q 'successfully authenticated'; then
              __GT_SSH_OK=1
            fi
          fi
          export __GT_SSH_OK

          if [ "$__GT_SSH_OK" = 1 ]; then
            echo "git: the server has a working GitHub SSH key — using it"
          else
            git_use_token "$GIT_AUTH_TOKEN_GH"
            echo "git: no SSH access to github.com — using HTTPS with the runner token"
          fi
          PRELUDE_GIT
          } >> "$PRELUDE"

      - name: Checkout
        if: ${{ env.SCOPE != 'none' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref_name }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve deploy files
        if: ${{ env.SCOPE == 'selective' }}
        run: |
          set -euo pipefail

          # --- Target commit: the newest of COMMITS, checked out for the build ---
          if [ -z "$COMMITS" ]; then
            TARGET_COMMIT=$(git rev-parse HEAD)
            echo "No commits specified — TARGET_COMMIT = HEAD = $TARGET_COMMIT"
          else
            readarray -t COMMITS_ARR < <(echo "$COMMITS" | tr ',; \t\r\n' '\n' | tr -s '\n' | grep -v '^[[:space:]]*$')

            MISSING=()
            for commit in "${COMMITS_ARR[@]}"; do
              if git cat-file -e "${commit}^{commit}" 2>/dev/null; then continue; fi
              echo "Commit $commit is not reachable from any branch or tag — fetching by SHA"
              if git fetch --quiet origin "$commit" 2>/dev/null && git cat-file -e "${commit}^{commit}" 2>/dev/null; then
                continue
              fi
              MISSING+=("$commit")
            done
            if [ "${#MISSING[@]}" -gt 0 ]; then
              echo "::error::Commit(s) not found in $GITHUB_REPOSITORY: ${MISSING[*]}. Possible reasons: a typo; the commit was rewritten (rebase/amend/force-push) and the hash is stale; its branch was deleted; it belongs to a fork or another repository. Use a hash from 'git log' of the current branch." >&2
              exit 1
            fi

            TARGET_COMMIT=$(git log --no-walk --format='%ct %H' "${COMMITS_ARR[@]}" | sort -k1 -nr | head -1 | awk '{print $2}')
            echo "TARGET_COMMIT (latest by committer date) = $TARGET_COMMIT"
          fi

          echo "TARGET_COMMIT=$TARGET_COMMIT" >> "$GITHUB_ENV"

          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TARGET_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Checking out TARGET_COMMIT (HEAD was $HEAD_COMMIT)"
            git checkout --force --detach "$TARGET_COMMIT"
          fi

          # --- Upload / delete lists ---
          UPLOAD_FILE="$RUNNER_TEMP/files_upload.txt"
          DELETE_FILE="$RUNNER_TEMP/files_delete.txt"
          ALL_FILES="$RUNNER_TEMP/all_files.txt"
          : > "$UPLOAD_FILE"
          : > "$DELETE_FILE"
          : > "$ALL_FILES"

          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""

          if [ -z "$COMMITS" ]; then
            echo "=== No commits: collecting all paths ever touched in history ==="
            git log --pretty=format: --name-only | grep -v '^$' | sort -u > "$ALL_FILES" || true
          else
            for commit in "${COMMITS_ARR[@]}"; do
              commit="${commit// /}"
              [ -z "$commit" ] && continue
              echo "=== Commit $commit ==="
              git diff-tree --no-commit-id -r --name-only "$commit" >> "$ALL_FILES"
            done
            sort -u -o "$ALL_FILES" "$ALL_FILES"
          fi

          echo "Candidate files: $(wc -l < "$ALL_FILES")"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -n "$LOCAL_DIR" ]; then
              [[ "$file" == "$LOCAL_DIR/"* ]] || continue
              rel="${file#"$LOCAL_DIR/"}"
            else
              rel="$file"
            fi

            if git cat-file -e "$TARGET_COMMIT:$file" 2>/dev/null; then
              echo "$rel" >> "$UPLOAD_FILE"
            else
              if [ "${DEPLOY_MIRROR}" = "true" ] || [ "${DEPLOY_MIRROR}" = "full" ]; then
                echo "$rel" >> "$DELETE_FILE"
              fi
            fi
          done < "$ALL_FILES"

          # Never ship git metadata; with a mirror, .gitignore & co. are regular files.
          if [ "$DEPLOY_MIRROR" = "false" ]; then
            PAT='^\.git'
          else
            PAT='^\.git(/|$)|^\.github(/|$)'
          fi
          for f in "$UPLOAD_FILE" "$DELETE_FILE"; do
            { grep -vE "$PAT" "$f" || true; } | sort -u > "$f.tmp"
            mv "$f.tmp" "$f"
          done

          if ! [ -s "$UPLOAD_FILE" ] && ! [ -s "$DELETE_FILE" ]; then
            echo "::warning::No files match DEPLOY_LOCAL_DIR='${DEPLOY_LOCAL_DIR}'."
          fi

          echo "Files to upload: $(wc -l < "$UPLOAD_FILE")"
          echo "Files to delete: $(wc -l < "$DELETE_FILE")"

      - name: Download workspace
        id: workspace
        if: ${{ env.SCOPE == 'full' && env.RUN_CI == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: workspace-*
          merge-multiple: true
          path: ${{ runner.temp }}/workspace

      - name: Unpack workspace
        if: ${{ steps.workspace.outcome == 'success' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tars=( "$RUNNER_TEMP"/workspace/workspace-*.tar )
          if [ ${#tars[@]} -eq 0 ]; then
            echo "::error::Artifact workspace-* contains no workspace-*.tar." >&2
            exit 1
          fi
          for t in "${tars[@]}"; do
            echo "Unpacking $(basename "$t")"
            tar -xf "$t" -C .
          done
          rm -rf "$RUNNER_TEMP/workspace"

      - name: Resolve toolchain
        id: toolchain
        if: ${{ env.SCOPE == 'selective' && env.BUILD_COMMAND != '' }}
        env:
          TOOLCHAIN: ${{ vars.TOOLCHAIN }}
          MISE_FILES_HASH: ${{ hashFiles('.mise.toml', '.tool-versions') }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/toolchain-resolve.sh
          # Parses TOOLCHAIN ("node:24,php@8.4,ubi:owner/repo@1.2.3") into TOOLS, mise specs
          # "name@version" separated by spaces, and resolves MISE_DIR, where mise keeps the
          # installs, and TOOLCHAIN_KEY, the cache key of that directory.
          # Inputs: TOOLCHAIN, MISE_FILES_HASH (hashFiles of .mise.toml and .tool-versions).
          __backends="ubi,aqua,asdf,cargo,go,npm,pipx,gem,dotnet,spm,vfox,http"
          TOOLS=""
          while IFS= read -r __item; do
            __item="$(printf '%s' "$__item" | tr -d '[:space:]')"
            if [ -z "$__item" ]; then continue; fi
            __prefix="${__item%%:*}"
            __rest="${__item#*:}"
            if [ "$__prefix" != "$__item" ] && [[ ",$__backends," == *",$__prefix,"* ]] && [[ "$__rest" == */* ]]; then
              __after="${__rest##*/}"
              if [[ "$__after" == *@* ]]; then
                __ver="${__after##*@}"; __name="$__prefix:${__rest%@*}"
              else
                __ver="latest"; __name="$__prefix:$__rest"
              fi
            elif [[ "$__item" == *@* ]]; then
              __name="${__item%@*}"; __ver="${__item##*@}"
            elif [ "$__prefix" != "$__item" ]; then
              __name="$__prefix"; __ver="$__rest"
            else
              __name="$__item"; __ver="latest"
            fi
            TOOLS="$TOOLS $__name@$__ver"
          done <<< "$(printf '%s' "${TOOLCHAIN:-}" | tr ',' '\n')"
          TOOLS="${TOOLS# }"

          if [ -z "$TOOLS" ]; then
            echo "TOOLCHAIN is not set — skipping tool installation."
          else
            echo "Tools: $TOOLS"
          fi

          if [ -n "${MISE_DATA_DIR:-}" ]; then
            MISE_DIR="$MISE_DATA_DIR"
          elif [ -n "${XDG_DATA_HOME:-}" ]; then
            MISE_DIR="$XDG_DATA_HOME/mise"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            MISE_DIR="$LOCALAPPDATA/mise"
          else
            MISE_DIR="$HOME/.local/share/mise"
          fi
          MISE_DIR="$(printf '%s' "$MISE_DIR" | tr '\\' '/')"

          # The key is shared by every job that installs the toolchain; keep its format stable,
          # or caches already saved on the default branch stop matching.
          # TOOLCHAIN_BUILD is bumped when the way tools are built changes (toolchain-deps.sh: system
          # libraries, configure options): a cached build made the old way would be restored and never
          # rebuilt. 2 — PHP with sodium.
          TOOLCHAIN_BUILD=2
          TOOLCHAIN_KEY="mise-${RUNNER_OS}-${RUNNER_ARCH}-b${TOOLCHAIN_BUILD}-${MISE_FILES_HASH:-}-${TOOLS}"

          unset __backends __item __prefix __rest __after __ver __name TOOLCHAIN_BUILD
          # <<< .github/snippets/toolchain-resolve.sh

          {
            echo "tools=$TOOLS"
            echo "mise_dir=$MISE_DIR"
            echo "toolchain_key=$TOOLCHAIN_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        if: ${{ steps.toolchain.outputs.tools != '' }}
        uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.mise_dir }}
          key: ${{ steps.toolchain.outputs.toolchain_key }}

      - name: Install toolchain
        if: ${{ steps.toolchain.outputs.tools != '' }}
        env:
          TOOLS: ${{ steps.toolchain.outputs.tools }}
          MISE_DIR: ${{ steps.toolchain.outputs.mise_dir }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/mise-download.sh
          # Downloads the mise binary into MISE_BIN_DIR and sets MISE to its path. The CDN serves
          # the latest release; when it is down, the version comes from the VERSION endpoint or
          # the GitHub API, and as a last resort a pinned release is used.
          # Inputs: GH_TOKEN (optional, for the GitHub API).
          case "$RUNNER_OS" in
            Linux)   __os=linux ;;
            macOS)   __os=macos ;;
            Windows) __os=windows ;;
            *) echo "::error::Unsupported OS RUNNER_OS='$RUNNER_OS'." >&2; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   __arch=x64 ;;
            ARM64) __arch=arm64 ;;
            *) echo "::error::Unsupported architecture RUNNER_ARCH='$RUNNER_ARCH'." >&2; exit 1 ;;
          esac
          __ext=""
          if [ "$__os" = "windows" ]; then __ext=".exe"; fi

          __tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then __tmp="$(cygpath -u "$RUNNER_TEMP")"; fi
          MISE_BIN_DIR="$__tmp/mise-bin"
          mkdir -p "$MISE_BIN_DIR"
          MISE="$MISE_BIN_DIR/mise${__ext}"

          MISE_FALLBACK_VERSION="v2026.7.12"

          __try_download() {
            echo "  trying $1"
            curl -fsSL --retry 3 --retry-delay 2 -o "$MISE" "$1" 2>/dev/null || return 1
            chmod +x "$MISE" 2>/dev/null || true
            "$MISE" --version >/dev/null 2>&1 || return 1
            return 0
          }

          __release_url() {
            printf 'https://github.com/jdx/mise/releases/download/%s/mise-%s-%s-%s%s' "$1" "$1" "$__os" "$__arch" "$__ext"
          }

          __ok=false
          echo "Resolving mise version…"
          if __try_download "https://mise.jdx.dev/mise-latest-${__os}-${__arch}${__ext}"; then
            __ok=true
          else
            echo "::warning::The mise CDN is unavailable — trying the VERSION endpoint and the GitHub API."
            __ver=$(curl -fsSL --retry 2 https://mise.jdx.dev/VERSION 2>/dev/null | tr -d '[:space:]' || true)
            if [ -n "$__ver" ]; then
              case "$__ver" in v*) ;; *) __ver="v$__ver" ;; esac
              if __try_download "$(__release_url "$__ver")"; then __ok=true; fi
            fi
            if [ "$__ok" != "true" ]; then
              __api="https://api.github.com/repos/jdx/mise/releases/latest"
              if [ -n "${GH_TOKEN:-}" ]; then
                __body=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$__api" 2>/dev/null || true)
              else
                __body=$(curl -fsSL "$__api" 2>/dev/null || true)
              fi
              __ver=$(printf '%s' "$__body" | grep -m1 '"tag_name"' | sed 's/.*"tag_name"[^"]*"\([^"]*\)".*/\1/' || true)
              if [ -n "$__ver" ] && __try_download "$(__release_url "$__ver")"; then __ok=true; fi
            fi
            if [ "$__ok" != "true" ]; then
              echo "::warning::Neither the CDN nor the API responded — falling back to the pinned version $MISE_FALLBACK_VERSION."
              if __try_download "$(__release_url "$MISE_FALLBACK_VERSION")"; then __ok=true; fi
            fi
          fi

          if [ "$__ok" != "true" ]; then
            echo "::error::Failed to download mise. Check the runner's access to github.com and mise.jdx.dev." >&2
            exit 1
          fi
          echo "mise $("$MISE" --version)"

          unset -f __try_download __release_url
          unset __os __arch __ext __tmp __ok __ver __api __body
          # <<< .github/snippets/mise-download.sh

          # >>> .github/snippets/toolchain-deps.sh
          # Some mise plugins build a tool from source and expect the system libraries
          # to be present. The built binary links against them dynamically, so they are
          # installed on every run, including a toolchain cache hit.
          __pkgs=()
          if [ "${RUNNER_OS:-}" = "Linux" ] && command -v apt-get >/dev/null 2>&1; then
            for __t in ${TOOLS:-}; do
              __n="${__t%@*}"
              case "$__n" in
                php|*/php|*-php)
                  __pkgs+=(build-essential autoconf bison re2c pkg-config
                    libxml2-dev libssl-dev libicu-dev libzip-dev libonig-dev libcurl4-openssl-dev
                    libpng-dev libjpeg-dev libfreetype-dev libwebp-dev libgmp-dev libsodium-dev
                    libreadline-dev libbz2-dev libsqlite3-dev libpq-dev libgd-dev)
                  # mise builds PHP with vfox-php, which passes --with-sodium only on macOS: on Linux
                  # libsodium-dev alone leaves PHP without the sodium extension. The flag goes into
                  # PHP_EXTRA_CONFIGURE_OPTIONS, which vfox-php appends to its own options;
                  # PHP_CONFIGURE_OPTIONS would replace them all (mbstring, intl, gd would be gone).
                  case " ${PHP_EXTRA_CONFIGURE_OPTIONS:-} " in
                    *" --with-sodium"*) ;;
                    *) export PHP_EXTRA_CONFIGURE_OPTIONS="${PHP_EXTRA_CONFIGURE_OPTIONS:+$PHP_EXTRA_CONFIGURE_OPTIONS }--with-sodium" ;;
                  esac
                  ;;
              esac
            done
          fi

          # Arrays are expanded only when non-empty: macOS runners ship bash 3.2, where
          # "${a[@]}" of an empty array trips set -u.
          if [ "${#__pkgs[@]}" -gt 0 ]; then
            __missing=()
            for __p in "${__pkgs[@]}"; do
              if [ "${#__missing[@]}" -gt 0 ]; then
                case " ${__missing[*]} " in *" $__p "*) continue ;; esac
              fi
              if ! dpkg-query -W -f='${Status}' "$__p" 2>/dev/null | grep -q 'install ok installed'; then
                __missing+=("$__p")
              fi
            done

            if [ "${#__missing[@]}" -eq 0 ]; then
              echo "Toolchain build dependencies already present."
            else
              echo "Installing toolchain build dependencies: ${__missing[*]}"
              sudo apt-get update -q
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${__missing[@]}"
            fi
          fi

          unset __pkgs __missing __p __t __n
          # <<< .github/snippets/toolchain-deps.sh

          # >>> .github/snippets/mise-use.sh
          # Installs TOOLS with mise and puts them on PATH for the following steps. A tool
          # already in MISE_DIR (restored from the toolchain cache) is not installed again.
          # Inputs: MISE, MISE_BIN_DIR, MISE_DIR, TOOLS.
          export MISE_YES=1 MISE_PYTHON_COMPILE=false
          # shellcheck disable=SC2086 # TOOLS is a list of specs
          "$MISE" use --global $TOOLS
          "$MISE" ls --installed

          {
            "$MISE" bin-paths 2>/dev/null || true
            printf '%s\n%s\n' "$MISE_DIR/shims" "$MISE_BIN_DIR"
          } | while IFS= read -r __p; do
            [ -z "$__p" ] && continue
            if command -v cygpath >/dev/null 2>&1; then __p="$(cygpath -w "$__p")"; fi
            printf '%s\n' "$__p" >> "$GITHUB_PATH"
          done
          # <<< .github/snippets/mise-use.sh

      - name: Build
        if: ${{ env.SCOPE == 'selective' && env.BUILD_COMMAND != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${CTX_ENV:-}" ] && [ -f "$CTX_ENV" ]; then . "$CTX_ENV"; fi

          eval "${BUILD_COMMAND//$'\r'/}"

      - name: Acquire deploy lock
        id: deploy-lock
        run: |
          set -euo pipefail

          LK_LIB="$RUNNER_TEMP/deploy_lock.sh"
          cat > "$LK_LIB" <<'LK_SNIPPET'
          # >>> .github/snippets/deploy-lock.sh
          LK_BASE="${LK_BASE:-}"
          LK_TRANSPORT="${LK_TRANSPORT:-local}"
          LK_BEAT="${LK_BEAT:-15}"
          LK_STALE="${LK_STALE:-90}"
          LK_WAIT="${LK_WAIT:-1800}"
          LK_MAX_HOLD="${LK_MAX_HOLD:-3600}"
          LK_POLL="${LK_POLL:-10}"
          LK_LOG_EVERY="${LK_LOG_EVERY:-60}"
          LK_TOKEN="${LK_TOKEN:-}"
          LK_SHARED_BASE="${LK_SHARED_BASE:-}"
          LK_SUPERSEDED="${LK_SUPERSEDED:-false}"

          lk_now()   { date +%s; }
          lk_sleep() { sleep "$1"; }
          lk_log()   { printf '%s\n' "$*" >&2; }

          lk_base() {
            if [ -n "$LK_BASE" ]; then printf '%s' "$LK_BASE"
            elif [ "$LK_TRANSPORT" = "ftp" ]; then printf '.git_toolkit'
            else printf '/tmp/git_toolkit'
            fi
          }

          lk__fs_ensure_base() {
            local b="$1" d mode
            umask 000
            for d in "$b" "$b/state"; do
              mkdir -m 0777 "$d" 2>/dev/null || true
              if [ ! -d "$d" ]; then
                echo "::error::Deploy lock: cannot create '$d'." >&2
                return 2
              fi
              mode="$(stat -c %a "$d" 2>/dev/null || echo '?')"
              if [ "$mode" != "777" ] && [ -O "$d" ]; then
                chmod 0777 "$d" 2>/dev/null && mode=777
              fi
              if [ "$mode" != "777" ]; then
                echo "::error::Deploy lock: '$d' has mode $mode and belongs to another user; other deploy users could not take over its stale locks. Fix once on the server: chmod 0777 '$d'" >&2
                return 2
              fi
            done
          }

          lk__fs_mkdir() {
            umask 000
            if mkdir -m 0777 "$1/$2" 2>/dev/null; then return 0; fi
            if [ -e "$1/$2" ]; then return 1; fi
            return 2
          }

          lk__fs_read() { cat "$1/$2" 2>/dev/null; }

          lk__fs_write() {
            local f="$1/$2"
            umask 000
            cat > "$f.tmp.$$" 2>/dev/null && mv -f "$f.tmp.$$" "$f" 2>/dev/null && return 0
            rm -f "$f.tmp.$$" 2>/dev/null
            return 1
          }

          lk__fs_rename() { mv -T "$1/$2" "$1/$3" 2>/dev/null; }

          lk__fs_rmtree() { rm -rf "${1:?}/${2:?}" 2>/dev/null; }

          lk__ssh() {
            local fn="$1" rc=0 script guard=()
            shift
            script="$(declare -f "$fn")"$'\n'
            if [ -n "${LK__DATA+x}" ]; then
              script+="printf '%s' $(printf '%q' "$LK__DATA") | "
            fi
            script+="$(printf '%q ' "$fn" "$(lk_base)" "$@")"$'\n'
            command -v timeout >/dev/null 2>&1 && guard=(timeout -k 5 "${LK_SSH_OP_TIMEOUT:-90}")
            "${guard[@]}" "${LK_SSH:?LK_SSH is not set}" "${LK_SSH_TARGET:?LK_SSH_TARGET is not set}" bash -s <<< "$script" || rc=$?
            case "$rc" in 124|137|255) rc=2 ;; esac
            return "$rc"
          }

          lk__ftp() {
            local guard=()
            command -v timeout >/dev/null 2>&1 && guard=(timeout -k 5 "${LK_FTP_OP_TIMEOUT:-90}")
            {
              printf '%s\n' \
                "set net:timeout 20" \
                "set net:max-retries 2" \
                "set net:reconnect-interval-base 3" \
                "set dns:fatal-timeout 15" \
                "set ftp:passive-mode true" \
                "set ssl:verify-certificate no"
              cat
              echo "quit"
            } | "${guard[@]}" lftp -u "${LK_FTP_USER:?LK_FTP_USER is not set},${LK_FTP_PASS:-}" -p "${LK_FTP_PORT:-21}" "${LK_FTP_HOST:?LK_FTP_HOST is not set}"
          }

          lk__ftp_path() { printf '"%s/%s"' "$(lk_base)" "$1"; }

          lkt_ensure_base() {
            case "$LK_TRANSPORT" in
              local) lk__fs_ensure_base "$(lk_base)" ;;
              ssh)   lk__ssh lk__fs_ensure_base ;;
              ftp)
                printf 'mkdir -p %s\n' "$(lk__ftp_path state)" | lk__ftp >/dev/null 2>&1 || true
                printf 'chmod 777 "%s"\nchmod 777 %s\n' "$(lk_base)" "$(lk__ftp_path state)" | lk__ftp >/dev/null 2>&1 || true
                if ! printf 'cd %s\n' "$(lk__ftp_path state)" | lk__ftp >/dev/null 2>&1; then
                  echo "::error::Deploy lock: cannot create '$(lk_base)/state' over FTP." >&2
                  return 2
                fi
                ;;
              *) echo "::error::Deploy lock: unknown transport '$LK_TRANSPORT'." >&2; return 2 ;;
            esac
          }

          lkt_mkdir() {
            case "$LK_TRANSPORT" in
              local) lk__fs_mkdir "$(lk_base)" "$1" ;;
              ssh)   lk__ssh lk__fs_mkdir "$1" ;;
              ftp)
                if printf 'mkdir %s\n' "$(lk__ftp_path "$1")" | lk__ftp >/dev/null 2>&1; then
                  printf 'chmod 777 %s\n' "$(lk__ftp_path "$1")" | lk__ftp >/dev/null 2>&1 || true
                  return 0
                fi
                if printf 'cd %s\n' "$(lk__ftp_path state)" | lk__ftp >/dev/null 2>&1; then return 1; fi
                return 2
                ;;
            esac
          }

          lkt_read() {
            case "$LK_TRANSPORT" in
              local) lk__fs_read "$(lk_base)" "$1" ;;
              ssh)   lk__ssh lk__fs_read "$1" ;;
              ftp)   printf 'cat %s\n' "$(lk__ftp_path "$1")" | lk__ftp 2>/dev/null ;;
            esac
          }

          lkt_write() {
            local LK__DATA rc=0 tmp
            LK__DATA="$(cat)"$'\n'
            case "$LK_TRANSPORT" in
              local) printf '%s' "$LK__DATA" | lk__fs_write "$(lk_base)" "$1" ;;
              ssh)   lk__ssh lk__fs_write "$1" ;;
              ftp)
                tmp="$(mktemp)"
                printf '%s' "$LK__DATA" > "$tmp"
                printf 'put %s -o %s\n' "$tmp" "$(lk__ftp_path "$1")" | lk__ftp >/dev/null 2>&1 || rc=$?
                rm -f "$tmp"
                return "$rc"
                ;;
            esac
          }

          lkt_rename() {
            case "$LK_TRANSPORT" in
              local) lk__fs_rename "$(lk_base)" "$1" "$2" ;;
              ssh)   lk__ssh lk__fs_rename "$1" "$2" ;;
              ftp)   printf 'mv %s %s\n' "$(lk__ftp_path "$1")" "$(lk__ftp_path "$2")" | lk__ftp >/dev/null 2>&1 ;;
            esac
          }

          lkt_rmtree() {
            case "$LK_TRANSPORT" in
              local) lk__fs_rmtree "$(lk_base)" "$1" ;;
              ssh)   lk__ssh lk__fs_rmtree "$1" ;;
              ftp)
                {
                  [ -n "${2:-}" ] && printf 'rm -f %s\n' "$(lk__ftp_path "$1/beat.$2")"
                  printf 'rm -f %s\nrmdir %s\n' "$(lk__ftp_path "$1/owner")" "$(lk__ftp_path "$1")"
                } | lk__ftp >/dev/null 2>&1 && return 0
                printf 'rm -r -f %s\n' "$(lk__ftp_path "$1")" | lk__ftp >/dev/null 2>&1
                ;;
            esac
          }

          lk__clean() { local v="${1:-}"; v="${v//$'\r'/}"; printf '%s' "${v//$'\n'/ }"; }

          lk_field() {
            local want="$1" line
            while IFS= read -r line; do
              if [ "${line%%=*}" = "$want" ]; then printf '%s' "${line#*=}"; return 0; fi
            done <<< "${2:-}"
            return 1
          }

          lk__token() {
            local b
            if [ -r /dev/urandom ]; then b="$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"; else b="$$$RANDOM"; fi
            printf '%s-%s-%s' "${LK_RUN_ID:-local}" "${LK_RUN_ATTEMPT:-1}" "$b"
          }

          lk__owner_text() {
            local k v n
            for k in token repo workflow environment source run_id run_number run_attempt run_url commit actor deploy_user method acquired_at; do
              case "$k" in
                token)       v="$LK_TOKEN" ;;
                acquired_at) v="$(lk_now)" ;;
                *)           n="LK_${k^^}"; v="${!n:-}" ;;
              esac
              printf '%s=%s\n' "$k" "$(lk__clean "$v")"
            done
          }

          lk_describe() {
            local o="${1:-}" repo env num url commit user method since held=""
            if [ -z "$o" ]; then printf 'unknown owner (no owner file)'; return 0; fi
            repo="$(lk_field repo "$o" || true)"
            env="$(lk_field environment "$o" || true)"
            num="$(lk_field run_number "$o" || true)"
            url="$(lk_field run_url "$o" || true)"
            commit="$(lk_field commit "$o" || true)"
            user="$(lk_field deploy_user "$o" || true)"
            method="$(lk_field method "$o" || true)"
            since="$(lk_field acquired_at "$o" || true)"
            case "$since" in ''|*[!0-9]*) ;; *) held=", held ~$(( $(lk_now) - since ))s" ;; esac
            printf '%s [%s] run #%s %s, commit %s, user %s, method %s%s' \
              "${repo:-?}" "${env:-?}" "${num:-?}" "${url:-?}" "${commit:0:7}" "${user:-?}" "${method:-?}" "$held"
          }

          lk__steal() {
            local expect="$1" o tomb got
            tomb="deploy.lock.stale.$LK_TOKEN"
            o="$(lkt_read deploy.lock/owner || true)"
            [ "$(lk_field token "$o" || true)" = "$expect" ] || return 1
            lkt_rename deploy.lock "$tomb" || return 1
            got="$(lk_field token "$(lkt_read "$tomb/owner" || true)" || true)"
            if [ "$got" != "$expect" ]; then
              lkt_rename "$tomb" deploy.lock || lk_log "::warning::Deploy lock: a fresh lock was moved aside by mistake and could not be put back ($(lk_base)/$tomb)."
              return 1
            fi
            lkt_rmtree "$tomb" "$expect" || true
            lk_log "::warning::Deploy lock: removed an abandoned lock (no heartbeat for ${LK_STALE}s): $(lk_describe "$o")"
            return 0
          }

          lk__keep_held() {
            local rc=0
            [ -n "${LK_HELD_BASE:-}" ] || return 0
            LK_BASE="$LK_HELD_BASE" lk__beat_once "w$1" || rc=$?
            if [ "$rc" -eq 1 ]; then
              echo "::error::Deploy lock: lost $LK_HELD_BASE/deploy.lock while waiting for $(lk_base)/deploy.lock." >&2
              return 1
            fi
            return 0
          }

          lk_acquire() {
            local start now rc o beat key seen_key="" seen_at=0 last_log=0 tok held=0
            lkt_ensure_base || return 2
            [ -n "$LK_TOKEN" ] || LK_TOKEN="$(lk__token)"
            start="$(lk_now)"
            while :; do
              rc=0; lkt_mkdir deploy.lock || rc=$?
              if [ "$rc" -eq 0 ]; then
                if ! lk__owner_text | lkt_write deploy.lock/owner; then
                  lkt_rmtree deploy.lock "$LK_TOKEN" || true
                  echo "::error::Deploy lock: cannot write the owner file into $(lk_base)/deploy.lock." >&2
                  return 2
                fi
                printf '%s 0' "$LK_TOKEN" | lkt_write "deploy.lock/beat.$LK_TOKEN" || true
                lk_log "Deploy lock acquired: $(lk_base)/deploy.lock (token $LK_TOKEN, waited $(( $(lk_now) - start ))s)"
                return 0
              fi
              if [ "$rc" -ne 1 ]; then
                if [ $(( $(lk_now) - start )) -ge "$LK_WAIT" ]; then
                  echo "::error::Deploy lock: gave up after ${LK_WAIT}s — cannot create $(lk_base)/deploy.lock." >&2
                  return 2
                fi
                lkt_ensure_base || return 2
                held=$(( held + 1 )); lk__keep_held "$held" || return 2
                lk_sleep "$LK_POLL"
                continue
              fi

              o="$(lkt_read deploy.lock/owner || true)"
              tok="$(lk_field token "$o" || true)"
              beat=""
              [ -n "$tok" ] && beat="$(lkt_read "deploy.lock/beat.$tok" || true)"
              now="$(lk_now)"
              key="$tok|$beat"

              if [ "$key" != "$seen_key" ]; then
                if [ "${seen_key%%|*}" != "$tok" ] || [ -z "$seen_key" ]; then
                  lk_log "Waiting for the deploy lock: $(lk_describe "$o")"
                  last_log="$now"
                fi
                seen_key="$key"; seen_at="$now"
              elif [ $(( now - seen_at )) -ge "$LK_STALE" ]; then
                if lk__steal "$tok"; then seen_key=""; continue; fi
                seen_key=""
              fi

              if [ $(( now - start )) -ge "$LK_WAIT" ]; then
                echo "::error::Deploy lock: gave up after ${LK_WAIT}s. The lock is held by: $(lk_describe "$o"). If that run is dead, remove $(lk_base)/deploy.lock on the server." >&2
                return 1
              fi
              if [ $(( now - last_log )) -ge "$LK_LOG_EVERY" ]; then
                lk_log "Still waiting ($(( now - start ))s): $(lk_describe "$o")"
                last_log="$now"
              fi
              held=$(( held + 1 )); lk__keep_held "$held" || return 2
              lk_sleep "$LK_POLL"
            done
          }

          lk__beat_once() {
            local o tok
            o="$(lkt_read deploy.lock/owner)" || return 2
            tok="$(lk_field token "$o" || true)"
            if [ "$tok" != "$LK_TOKEN" ]; then
              lk_log "::warning::Deploy lock: $(lk_base)/deploy.lock was taken over by $(lk_describe "$o") — heartbeat stopped."
              return 1
            fi
            printf '%s %s' "$LK_TOKEN" "$1" | lkt_write "deploy.lock/beat.$LK_TOKEN" || return 2
          }

          lk_heartbeat() {
            local seq=0 fails=0 start rc
            start="$(lk_now)"
            while :; do
              lk_sleep "$LK_BEAT"
              if [ $(( $(lk_now) - start )) -ge "$LK_MAX_HOLD" ]; then
                lk_log "::warning::Deploy lock: held for over ${LK_MAX_HOLD}s — heartbeat stopped, the next deploy may take the lock over in ${LK_STALE}s."
                return 0
              fi
              seq=$(( seq + 1 ))
              rc=0
              lk__beat_once "$seq" || rc=$?
              if [ "$rc" -eq 0 ] && [ -n "${LK_SHARED_BASE:-}" ]; then
                LK_BASE="$LK_SHARED_BASE" lk__beat_once "$seq" || rc=$?
              fi
              case "$rc" in
                0) fails=0 ;;
                1) return 1 ;;
                *)
                  fails=$(( fails + 1 ))
                  if [ "$fails" -ge 3 ]; then
                    lk_log "::warning::Deploy lock: heartbeat failed 3 times in a row — stopped."
                    return 1
                  fi
                  ;;
              esac
            done
          }

          lk_release() {
            local o tok tomb got
            [ -n "$LK_TOKEN" ] || return 0
            o="$(lkt_read deploy.lock/owner || true)"
            tok="$(lk_field token "$o" || true)"
            if [ "$tok" != "$LK_TOKEN" ]; then
              [ -n "$o" ] && lk_log "::warning::Deploy lock: not released — it now belongs to $(lk_describe "$o")."
              return 0
            fi
            tomb="deploy.lock.done.$LK_TOKEN"
            lkt_rename deploy.lock "$tomb" || { lk_log "::warning::Deploy lock: cannot release $(lk_base)/deploy.lock."; return 1; }
            got="$(lk_field token "$(lkt_read "$tomb/owner" || true)" || true)"
            if [ "$got" != "$LK_TOKEN" ]; then
              lkt_rename "$tomb" deploy.lock || true
              return 0
            fi
            lkt_rmtree "$tomb" "$LK_TOKEN" || true
            lk_log "Deploy lock released: $(lk_base)/deploy.lock"
          }

          lk_acquire_all() {
            local rc=0
            lk_acquire || return $?
            [ -n "${LK_SHARED_BASE:-}" ] || return 0
            LK_HELD_BASE="$(lk_base)" LK_BASE="$LK_SHARED_BASE" lk_acquire || rc=$?
            if [ "$rc" -ne 0 ]; then
              lk_release || true
              return "$rc"
            fi
          }

          lk_release_all() {
            local rc=0
            if [ -n "${LK_SHARED_BASE:-}" ]; then
              LK_BASE="$LK_SHARED_BASE" lk_release || rc=$?
            fi
            lk_release || rc=$?
            return "$rc"
          }

          lk__workflow() { local w="${LK_WORKFLOW:-}"; printf '%s' "${w%@*}"; }

          lk_source_from_ref() {
            local name="${REF_NAME:-}"
            case "${REF_TYPE:-}" in
              branch) printf 'branch:%s' "${name//\//-}" ;;
              tag)
                if [ "${name#*/}" != "$name" ]; then
                  name="${name%/*}"
                  printf 'branch:%s' "${name//\//-}"
                else
                  printf 'branch:%s' "${REF_BRANCH:-}"
                fi
                ;;
              pr) printf '%s' "${REF_NAME_NORM:-}" ;;
              *)  printf '%s:%s' "${REF_TYPE:-}" "$name" ;;
            esac
          }

          lk_state_key() {
            printf '%s|%s|%s|%s' "${LK_REPO:-}" "$(lk__workflow)" "${LK_ENVIRONMENT:-}" "${LK_SOURCE:-}" | sha1sum | cut -c1-40
          }

          lk__state_text() {
            printf 'repo=%s\n'        "$(lk__clean "${LK_REPO:-}")"
            printf 'workflow=%s\n'    "$(lk__clean "$(lk__workflow)")"
            printf 'environment=%s\n' "$(lk__clean "${LK_ENVIRONMENT:-}")"
            printf 'source=%s\n'      "$(lk__clean "${LK_SOURCE:-}")"
            printf 'scope=%s\n'       "$(lk__clean "${LK_SCOPE:-}")"
            printf 'run_id=%s\n'      "$(lk__clean "${LK_RUN_ID:-}")"
            printf 'run_number=%s\n'  "$LK_RUN_NUMBER"
            printf 'run_attempt=%s\n' "$(lk__clean "${LK_RUN_ATTEMPT:-}")"
            printf 'run_url=%s\n'     "$(lk__clean "${LK_RUN_URL:-}")"
            printf 'commit=%s\n'      "$(lk__clean "${LK_COMMIT:-}")"
            printf 'at=%s\n'          "$(lk_now)"
            printf 'token=%s\n'       "$LK_TOKEN"
            printf 'status=%s\n'      "$1"
          }

          lk_check_state() {
            local key rec prev status prev_id what
            LK_SUPERSEDED=false
            case "${LK_RUN_NUMBER:-}" in ''|*[!0-9]*) return 0 ;; esac
            key="$(lk_state_key)"
            rec="$(lkt_read "state/$key" || true)"
            prev="$(lk_field run_number "$rec" || true)"
            case "$prev" in ''|*[!0-9]*) prev="" ;; esac
            if [ -n "$prev" ] && [ "$prev" -gt "$LK_RUN_NUMBER" ]; then
              LK_SUPERSEDED=true
              lk_log "::notice::Deploy skipped: a newer run #$prev already deployed ${LK_REPO:-?} [${LK_ENVIRONMENT:-?}, ${LK_SOURCE:-?}] (commit $(lk_field commit "$rec" | cut -c1-7), $(lk_field run_url "$rec" || true)). This run is #$LK_RUN_NUMBER. To roll back on purpose, start a new run via workflow_dispatch."
              return 0
            fi

            status="$(lk_field status "$rec" || true)"
            prev_id="$(lk_field run_id "$rec" || true)"
            if [ "$status" = running ] || [ "$status" = failed ]; then
              what="the previous deploy #${prev:-?} ($(lk_field run_url "$rec" || true), commit $(lk_field commit "$rec" | cut -c1-7)) did not complete (status: $status)"
              if [ -n "$prev_id" ] && [ "$prev_id" = "${LK_RUN_ID:-}" ]; then
                lk_log "::warning::Deploy lock: $what — this is a re-run of it, deploying the same changes again."
              elif [ "${LK_SCOPE:-}" = selective ]; then
                echo "::error::Deploy lock: $what. A selective deploy uploads only its own commits and would leave the gaps of that run on the server. Run a full deploy once: workflow_dispatch without 'commits' (or a push with DEPLOY_LAST_COMMITS=false)." >&2
                return 3
              else
                lk_log "::warning::Deploy lock: $what — this full deploy overwrites it."
              fi
            fi

            lk__state_text running | lkt_write "state/$key"
          }

          lk_mark_state() {
            local want="$1" only_if="${2:-}" key rec
            case "${LK_RUN_NUMBER:-}" in ''|*[!0-9]*) return 0 ;; esac
            [ -n "$LK_TOKEN" ] || return 0
            key="$(lk_state_key)"
            rec="$(lkt_read "state/$key" || true)"
            [ "$(lk_field token "$rec" || true)" = "$LK_TOKEN" ] || return 0
            if [ -n "$only_if" ] && [ "$(lk_field status "$rec" || true)" != "$only_if" ]; then return 0; fi
            lk__state_text "$want" | lkt_write "state/$key"
          }

          lk_stop_heartbeat() {
            local pid="${LK_HB_PID:-}"
            [ -n "$pid" ] || return 0
            kill -- "-$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true
          }
          # <<< .github/snippets/deploy-lock.sh
          LK_SNIPPET
          chmod 600 "$LK_LIB"
          # shellcheck source=/dev/null
          . "$LK_LIB"

          LK_SSH="${GT_SSH:-}"
          LK_BASE=""
          LK_SHARED_BASE=""
          if [ -n "${DEPLOY_LOCK_DIR:-}" ]; then
            if [ "$LK_TRANSPORT" = ftp ]; then
              LK_BASE="${DEPLOY_LOCK_DIR%/}"
            else
              case "$DEPLOY_LOCK_DIR" in
                /*) LK_SHARED_BASE="${DEPLOY_LOCK_DIR%/}" ;;
                *) echo "::error::DEPLOY_LOCK_DIR='$DEPLOY_LOCK_DIR' must be an absolute path on the server for DEPLOY_METHOD=$DEPLOY_METHOD."; exit 1 ;;
              esac
            fi
          fi
          LK_SOURCE="$(lk_source_from_ref)"
          LK_TOKEN="$(lk__token)"
          export LK_LIB LK_SSH LK_SOURCE LK_TOKEN LK_BASE LK_SHARED_BASE
          {
            echo "LK_LIB=$LK_LIB"
            echo "LK_SSH=$LK_SSH"
            echo "LK_BASE=$LK_BASE"
            echo "LK_SHARED_BASE=$LK_SHARED_BASE"
            echo "LK_SOURCE=$LK_SOURCE"
            echo "LK_TOKEN=$LK_TOKEN"
          } >> "$GITHUB_ENV"

          lk_acquire_all

          rc=0
          lk_check_state || rc=$?
          if [ "$rc" -ne 0 ] || [ "$LK_SUPERSEDED" = true ]; then
            lk_release_all
            echo "DEPLOY_SUPERSEDED=$LK_SUPERSEDED" >> "$GITHUB_ENV"
            echo "LK_TOKEN=" >> "$GITHUB_ENV"
            exit "$rc"
          fi

          nohup setsid bash -c '. "$LK_LIB"; lk_heartbeat' >> "$RUNNER_TEMP/deploy_lock_heartbeat.log" 2>&1 < /dev/null &
          echo "LK_HB_PID=$!" >> "$GITHUB_ENV"

      - name: Before deploy command
        id: before-deploy
        if: ${{ env.BEFORE_DEPLOY_COMMAND != '' && env.DEPLOY_METHOD != 'ftp' && env.DEPLOY_SUPERSEDED != 'true' }}
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          S="$RUNNER_TEMP/remote_before.sh"
          {
            echo 'set -e'
            if [ -n "${CTX_ENV:-}" ] && [ -f "$CTX_ENV" ]; then cat "$CTX_ENV"; fi
            printf 'export GH_TOKEN=%q\n'  "$GH_TOKEN"
            printf 'export PAT_TOKEN=%q\n' "${PAT_TOKEN:-}"
            printf 'export REF_TYPE=%q REF_NAME=%q REF_NAME_NORM=%q REF_BRANCH=%q REF_COMMIT=%q\n' \
              "$REF_TYPE" "$REF_NAME" "$REF_NAME_NORM" "$REF_BRANCH" "$REF_COMMIT"
            printf 'export PUBLISHED_IMAGE=%q PUBLISHED_IMAGE_TAG=%q\n' "${PUBLISHED_IMAGE:-}" "${PUBLISHED_IMAGE_TAG:-}"
            if [ -f "$RUNNER_TEMP/remote_prelude.sh" ]; then cat "$RUNNER_TEMP/remote_prelude.sh"; fi
            printf 'cd %q\n' "$DEPLOY_PATH"
            printf '%s\n' "${BEFORE_DEPLOY_COMMAND//$'\r'/}"
          } > "$S"
          chmod 600 "$S"

          "$GT_SSH" "$DEPLOY_USER@$DEPLOY_HOST" bash -s < "$S"

      - name: Deploy via FTP
        id: deploy-ftp
        if: ${{ env.DEPLOY_METHOD == 'ftp' && env.DEPLOY_SUPERSEDED != 'true' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail

          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""

          FAILED_FILE="$RUNNER_TEMP/ftp_failed.txt"
          BATCH_CMD_FILE="$RUNNER_TEMP/lftp_batch_cmds.txt"
          BATCH_LOG="$RUNNER_TEMP/lftp_batch.log"
          SINGLE_CMD_FILE="$RUNNER_TEMP/lftp_single_cmd.txt"
          : > "$FAILED_FILE"

          run_lftp_session() {
            local cmd_file="$1" max_retries="$2"
            {
              printf '%s\n' \
                "set net:timeout 30" \
                "set net:max-retries $max_retries" \
                "set net:reconnect-interval-base 5" \
                "set ftp:passive-mode true" \
                "set ssl:verify-certificate no" \
                "set ftp:list-options -a" \
                "set cmd:fail-exit true"
              cat "$cmd_file"
              echo "quit"
            } | lftp -u "$DEPLOY_USER,$DEPLOY_KEY" -p "$DEPLOY_PORT" "$DEPLOY_HOST"
          }

          # Runs BATCH_CMD_FILE up to 3 times; fails only when every attempt failed.
          run_lftp_batch() {
            local what="$1" attempt
            echo "Attempting batch $what..."
            for attempt in 1 2 3; do
              if run_lftp_session "$BATCH_CMD_FILE" 5 >"$BATCH_LOG" 2>&1; then
                cat "$BATCH_LOG"
                echo "Batch $what succeeded on attempt $attempt"
                return 0
              fi
              echo "::warning::Batch $what attempt $attempt/3 failed. lftp output:"
              cat "$BATCH_LOG"
            done
            return 1
          }

          # Fallback: one lftp session per file, 3 attempts each; failures are collected, not fatal.
          run_lftp_single() {
            local label="$1" attempt
            for attempt in 1 2 3; do
              if run_lftp_session "$SINGLE_CMD_FILE" 1; then return 0; fi
              echo "::warning::Per-file attempt $attempt/3 failed for '$label'"
            done
            echo "::warning::Skipping '$label' after 3 failed attempts"
            printf '%s\n' "$label" >> "$FAILED_FILE"
          }

          remote_dir_of() {
            local d
            d="$(dirname "$1")"
            if [ "$d" = "." ]; then printf '%s' "$DEPLOY_PATH"; else printf '%s/%s' "$DEPLOY_PATH" "$d"; fi
          }

          source_of() {
            if [ -z "$LOCAL_DIR" ]; then printf './%s' "$1"; else printf './%s/%s' "$LOCAL_DIR" "$1"; fi
          }

          if [ "$SCOPE" = "full" ]; then
            DELETE=""
            if [ "$DEPLOY_MIRROR" = "full" ]; then DELETE="--delete"; fi
            if [ "$DEPLOY_MIRROR" = "false" ]; then
              GIT_EX="--exclude-glob '.git*'"
            else
              GIT_EX="--exclude-glob '.git' --exclude-glob '.github'"
            fi

            printf '%s\n' "mirror -R --no-perms --parallel=2 --verbose $GIT_EX $DELETE \"$DEPLOY_LOCAL_DIR\" \"$DEPLOY_PATH\"" > "$BATCH_CMD_FILE"

            if ! run_lftp_batch mirror; then
              echo "Falling back to per-file upload..."
              SRC_BASE="${LOCAL_DIR:-.}"
              while IFS= read -r local_path; do
                rel_path="${local_path#./}"
                [ -n "$LOCAL_DIR" ] && rel_path="${rel_path#"$LOCAL_DIR/"}"
                remote_dir="$(remote_dir_of "$rel_path")"
                printf '%s\n' "mkdir -fp \"$remote_dir\"" "put -O \"$remote_dir\" \"$local_path\"" > "$SINGLE_CMD_FILE"
                run_lftp_single "$rel_path"
              done < <(
                if [ "$DEPLOY_MIRROR" = "false" ]; then
                  find "$SRC_BASE" \( -name '.git' -o -name '.github' -o -name '.gitignore' -o -name '.gitattributes' -o -name '.gitmodules' \) -prune -o -type f -print
                else
                  find "$SRC_BASE" \( -name '.git' -o -name '.github' \) -prune -o -type f -print
                fi
              )
            fi

          else
            UPLOAD_FILE="$RUNNER_TEMP/files_upload.txt"
            DELETE_FILE="$RUNNER_TEMP/files_delete.txt"

            if [ -s "$UPLOAD_FILE" ]; then
              : > "$BATCH_CMD_FILE"
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                remote_dir="$(remote_dir_of "$file")"
                printf '%s\n' "mkdir -fp \"$remote_dir\"" "put -O \"$remote_dir\" \"$(source_of "$file")\"" >> "$BATCH_CMD_FILE"
              done < "$UPLOAD_FILE"

              if ! run_lftp_batch upload; then
                echo "Falling back to per-file upload..."
                while IFS= read -r file; do
                  [ -z "$file" ] && continue
                  remote_dir="$(remote_dir_of "$file")"
                  printf '%s\n' "mkdir -fp \"$remote_dir\"" "put -O \"$remote_dir\" \"$(source_of "$file")\"" > "$SINGLE_CMD_FILE"
                  run_lftp_single "$file"
                done < "$UPLOAD_FILE"
              fi
            fi

            if [ -s "$DELETE_FILE" ]; then
              : > "$BATCH_CMD_FILE"
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                printf '%s\n' "rm -f \"$DEPLOY_PATH/$file\"" >> "$BATCH_CMD_FILE"
              done < "$DELETE_FILE"

              if ! run_lftp_batch delete; then
                echo "Falling back to per-file delete..."
                while IFS= read -r file; do
                  [ -z "$file" ] && continue
                  printf '%s\n' "rm -f \"$DEPLOY_PATH/$file\"" > "$SINGLE_CMD_FILE"
                  run_lftp_single "$file"
                done < "$DELETE_FILE"
              fi
            fi
          fi

          if [ -s "$FAILED_FILE" ]; then
            echo "::error::FTP deploy is incomplete: $(wc -l < "$FAILED_FILE" | tr -d ' ') file(s) failed after all retries:"
            sed 's/^/  /' "$FAILED_FILE"
            exit 1
          fi

      - name: Deploy via rsync
        id: deploy-rsync
        if: ${{ env.DEPLOY_METHOD == 'rsync' && env.DEPLOY_SUPERSEDED != 'true' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail

          attempt_rsync() {
            local rc attempt
            for attempt in 1 2 3; do
              if rsync "$@"; then return 0; fi
              rc=$?
              echo "::warning::rsync attempt $attempt/3 failed (exit $rc); retrying in 5s..."
              sleep 5
            done
            echo "::error::rsync failed after 3 attempts (last exit $rc)."
            return 1
          }

          if [ "$SCOPE" = "full" ]; then
            DELETE=""
            if [ "$DEPLOY_MIRROR" = "full" ]; then DELETE="--delete"; fi
            if [ "$DEPLOY_MIRROR" = "false" ]; then
              GIT_EX=(--exclude='/.git*')
            else
              GIT_EX=(--exclude='/.git' --exclude='/.github')
            fi

            attempt_rsync -avz --progress --timeout=30 $DELETE \
              -e "$GT_SSH" \
              "${GIT_EX[@]}" \
              --no-perms --no-owner --no-group \
              --omit-dir-times \
              --keep-dirlinks \
              "$DEPLOY_LOCAL_DIR/" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

          else
            LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
            LOCAL_DIR="${LOCAL_DIR#./}"
            [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""
            if [ -z "$LOCAL_DIR" ]; then SRC_DIR="./"; else SRC_DIR="$LOCAL_DIR/"; fi

            UPLOAD_FILE="$RUNNER_TEMP/files_upload.txt"
            DELETE_FILE="$RUNNER_TEMP/files_delete.txt"

            if [ -s "$UPLOAD_FILE" ]; then
              attempt_rsync -avz --progress --timeout=30 \
                -e "$GT_SSH" \
                --files-from="$UPLOAD_FILE" \
                --ignore-missing-args \
                --no-perms --no-owner --no-group \
                --omit-dir-times \
                --keep-dirlinks \
                "$SRC_DIR" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
            else
              echo "No files to upload."
            fi

            if { [ "$DEPLOY_MIRROR" = "true" ] || [ "$DEPLOY_MIRROR" = "full" ]; } && [ -s "$DELETE_FILE" ]; then
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                "$GT_SSH" -n "$DEPLOY_USER@$DEPLOY_HOST" "rm -f \"$DEPLOY_PATH/$file\""
              done < "$DELETE_FILE"
            fi
          fi

      - name: Deploy via git
        id: deploy-git
        if: ${{ env.DEPLOY_METHOD == 'git' && env.DEPLOY_SUPERSEDED != 'true' }}
        timeout-minutes: 60
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          KIND="$REF_TYPE"
          TARGET="$REF_NAME"
          echo "Deploying $KIND '$TARGET' of $REPO to $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

          S="$RUNNER_TEMP/remote_git.sh"
          {
            echo 'set -e'
            if [ -f "$RUNNER_TEMP/remote_prelude.sh" ]; then cat "$RUNNER_TEMP/remote_prelude.sh"; fi
            printf 'export __REPO=%q\n'   "$REPO"
            printf 'export __TARGET=%q\n' "$TARGET"
            printf 'export __KIND=%q\n'   "$KIND"
            printf 'export __MIRROR=%q\n' "$DEPLOY_MIRROR"
            printf 'export __DIR=%q\n'    "$DEPLOY_PATH"
            cat <<'REMOTE_GIT'
          cd "$__DIR"

          if [ "${__GT_SSH_OK:-0}" = 1 ]; then
            ORIGIN="git@github.com:$__REPO.git"
          else
            ORIGIN="https://github.com/$__REPO.git"
          fi

          __GT_MODE=native

          _git_try() {
            __m="$1"; shift
            case "$__m" in
              gh)  ( git_use_token "$GIT_AUTH_TOKEN_GH";  git "$@" ) ;;
              pat) ( git_use_token "$GIT_AUTH_TOKEN_PAT"; git "$@" ) ;;
              *)   git "$@" ;;
            esac
          }

          run_git() {
            if _git_try "$__GT_MODE" "$@"; then return 0; fi
            if [ "$__GT_MODE" != gh ] && [ -n "${GIT_AUTH_TOKEN_GH:-}" ]; then
              echo "git $1: retrying over HTTPS with GITHUB_TOKEN" >&2
              if _git_try gh "$@"; then __GT_MODE=gh; return 0; fi
            fi
            if [ "$__GT_MODE" != pat ] && [ -n "${GIT_AUTH_TOKEN_PAT:-}" ]; then
              echo "git $1: retrying over HTTPS with PAT_TOKEN" >&2
              if _git_try pat "$@"; then __GT_MODE=pat; return 0; fi
            fi
            return 1
          }

          if [ ! -d .git ]; then
            run_git clone --branch "$__TARGET" "$ORIGIN" .
          else
            git remote set-url origin "$ORIGIN"
            if [ "$__KIND" = "tag" ]; then
              run_git fetch --force origin "refs/tags/$__TARGET:refs/tags/$__TARGET"
              git checkout --force "refs/tags/$__TARGET"
            elif [ "$__MIRROR" = "full" ]; then
              run_git fetch --prune origin "+refs/heads/$__TARGET:refs/remotes/origin/$__TARGET"
              git checkout --force "$__TARGET" 2>/dev/null || git checkout --force -B "$__TARGET" "refs/remotes/origin/$__TARGET"
              git reset --hard "refs/remotes/origin/$__TARGET"
            else
              run_git pull origin "$__TARGET"
            fi
          fi

          if [ -f .gitmodules ]; then
            run_git submodule sync --recursive
            run_git submodule update --init --recursive
          fi

          git --no-pager log -1 --oneline
          REMOTE_GIT
          } > "$S"
          chmod 600 "$S"

          "$GT_SSH" "$DEPLOY_USER@$DEPLOY_HOST" bash -s < "$S"

      - name: After deploy command
        id: after-deploy
        if: ${{ env.AFTER_DEPLOY_COMMAND != '' && env.DEPLOY_METHOD != 'ftp' && env.DEPLOY_SUPERSEDED != 'true' }}
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          S="$RUNNER_TEMP/remote_after.sh"
          {
            echo 'set -e'
            if [ -n "${CTX_ENV:-}" ] && [ -f "$CTX_ENV" ]; then cat "$CTX_ENV"; fi
            printf 'export GH_TOKEN=%q\n'  "$GH_TOKEN"
            printf 'export PAT_TOKEN=%q\n' "${PAT_TOKEN:-}"
            printf 'export REF_TYPE=%q REF_NAME=%q REF_NAME_NORM=%q REF_BRANCH=%q REF_COMMIT=%q\n' \
              "$REF_TYPE" "$REF_NAME" "$REF_NAME_NORM" "$REF_BRANCH" "$REF_COMMIT"
            printf 'export PUBLISHED_IMAGE=%q PUBLISHED_IMAGE_TAG=%q\n' "${PUBLISHED_IMAGE:-}" "${PUBLISHED_IMAGE_TAG:-}"
            if [ -f "$RUNNER_TEMP/remote_prelude.sh" ]; then cat "$RUNNER_TEMP/remote_prelude.sh"; fi
            printf 'cd %q\n' "$DEPLOY_PATH"
            printf '%s\n' "${AFTER_DEPLOY_COMMAND//$'\r'/}"
          } > "$S"
          chmod 600 "$S"

          "$GT_SSH" "$DEPLOY_USER@$DEPLOY_HOST" bash -s < "$S"

      - name: Release deploy lock
        if: ${{ env.DEPLOY_SUPERSEDED != 'true' }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . "$LK_LIB"
          lk_mark_state ok
          lk_stop_heartbeat
          lk_release_all
          echo "LK_TOKEN=" >> "$GITHUB_ENV"

      - name: Clean up
        if: always()
        run: |
          set +e

          if [ -n "${LK_LIB:-}" ] && [ -f "$LK_LIB" ]; then
            # shellcheck source=/dev/null
            . "$LK_LIB"
            lk_stop_heartbeat
            lk_mark_state failed running
            lk_release_all
            if [ -s "$RUNNER_TEMP/deploy_lock_heartbeat.log" ]; then
              echo "=== Deploy lock heartbeat ==="
              cat "$RUNNER_TEMP/deploy_lock_heartbeat.log"
            fi
            rm -f "$LK_LIB" "$RUNNER_TEMP/deploy_lock_heartbeat.log" "$RUNNER_TEMP/ftp_failed.txt"
          fi

          rm -f "$RUNNER_TEMP/remote_prelude.sh" "$RUNNER_TEMP/remote_before.sh" \
                "$RUNNER_TEMP/remote_after.sh" "$RUNNER_TEMP/remote_git.sh"
          [ -n "${CTX_ENV:-}" ] && rm -f "$CTX_ENV"
          [ -n "${TMP_KEY:-}" ] && rm -f "$TMP_KEY"
          rm -f "$RUNNER_TEMP/gt-ssh" "$RUNNER_TEMP/ssh_probe_password.log" "$RUNNER_TEMP/ssh_probe_key.log"
          exit 0
