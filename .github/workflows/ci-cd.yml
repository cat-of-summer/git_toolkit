name: ci/cd

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
      - '**/v*'
  pull_request: {}
  workflow_dispatch:
    inputs:
      commits:
        description: 'Comma-separated commits to deploy. Empty = deploy the whole tree.'
        required: false
        type: string
        default: ''
      deploy_mirror:
        description: 'Deletions on the server: false = keep all, true = delete files removed in the commits, full = exact mirror. default = DEPLOY_MIRROR variable.'
        required: false
        type: choice
        options: ['default', 'false', 'true', 'full']
        default: 'default'
  workflow_call:
    inputs:
      commits:
        description: 'Comma-separated commits to deploy. Empty = deploy the whole tree.'
        required: false
        type: string
        default: ''
      deploy_mirror:
        description: 'Deletions on the server: false = keep all, true = delete files removed in the commits, full = exact mirror. Empty or default = DEPLOY_MIRROR variable.'
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_KEY:
        required: false
      DOCKER_TOKEN:
        required: false
      PAT_TOKEN:
        required: false
      PACKAGIST_API_TOKEN:
        required: false
      SECRETS_JSON:
        required: false

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:

  resolve-ref:
    runs-on: ubuntu-latest

    outputs:
      ref_type: ${{ steps.ref.outputs.ref_type }}
      ref_name: ${{ steps.ref.outputs.ref_name }}
      ref_name_norm: ${{ steps.ref.outputs.ref_name_norm }}
      ref_commit: ${{ steps.ref.outputs.ref_commit }}
      ref_branch: ${{ steps.env.outputs.ref_branch }}
      ref_tag: ${{ steps.ref.outputs.ref_tag }}
      environment: ${{ steps.env.outputs.environment }}
      pkg_suffix: ${{ steps.env.outputs.pkg_suffix }}

    steps:
      - name: Resolve ref
        id: ref
        env:
          MULTIPLE_PACKAGES: ${{ vars.MULTIPLE_PACKAGES }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/resolve-ref.sh
          __lower() { printf '%s' "${1:-}" | tr -d '\r' | tr '[:upper:]' '[:lower:]'; }
          __trim()  { printf '%s' "${1:-}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          __slug()  { printf '%s' "${1:-}" | tr -d '\r' | tr '/' '-'; }
          __fail()  { echo "::error::$1" >&2; exit 1; }

          MULTIPLE_PACKAGES="$(__lower "$(__trim "${MULTIPLE_PACKAGES:-}")")"

          __event="${GITHUB_EVENT_NAME:-}"
          __raw_type="$(__trim "${GITHUB_REF_TYPE:-}")"
          __raw_name="$(__trim "${GITHUB_REF_NAME:-}")"

          REF_TYPE=""
          REF_NAME="$__raw_name"
          REF_NAME_NORM=""
          REF_BRANCH=""
          REF_COMMIT="$(__trim "${GITHUB_SHA:-}")"
          REF_TAG=""
          REF_TAG_BRANCH=""

          case "$__event" in
            pull_request|pull_request_target)
              REF_TYPE="pr"
              __pr="$(__trim "${PR_NUMBER:-}")"
              if [ -z "$__pr" ]; then __pr="${__raw_name%%/*}"; fi
              REF_NAME_NORM="pr-${__pr}"
              REF_BRANCH="$(__slug "${PR_BASE_REF:-}")"
              __head="$(__trim "${PR_HEAD_SHA:-}")"
              if [ -n "$__head" ]; then REF_COMMIT="$__head"; fi
              ;;

            *)
              if [ "$__raw_type" = "tag" ]; then
                REF_TYPE="tag"

                __prefix=""
                __vpart="$__raw_name"
                if [ "${__raw_name#*/}" != "$__raw_name" ]; then
                  __prefix="${__raw_name%/*}"
                  __vpart="${__raw_name##*/}"
                fi

                if ! printf '%s' "$__vpart" | grep -qE '^v[0-9]+(\.[0-9]+)*$'; then
                  __fail "Tag '$__vpart' is not a v-version tag (expected v#, v#.#, v#.#.#)."
                fi
                if [ "$MULTIPLE_PACKAGES" = "true" ] && [ -z "$__prefix" ]; then
                  __fail "MULTIPLE_PACKAGES=true: the tag must have the form '{branch}/vX.Y.Z' (got '$__raw_name')."
                fi
                if [ "$MULTIPLE_PACKAGES" != "true" ] && [ -n "$__prefix" ]; then
                  __fail "MULTIPLE_PACKAGES is off: the tag must have the form 'vX.Y.Z' without a branch prefix (got '$__raw_name'). Set MULTIPLE_PACKAGES=true to use '{branch}/vX.Y.Z' tags."
                fi

                REF_TAG="$__vpart"
                REF_TAG_BRANCH="$__prefix"
                REF_BRANCH="$(__slug "$__prefix")"
                if [ -n "$__prefix" ]; then
                  REF_NAME_NORM="${REF_BRANCH}-${__vpart#v}"
                else
                  REF_NAME_NORM="${__vpart#v}"
                fi
              else
                REF_TYPE="branch"
                REF_BRANCH="$(__slug "$__raw_name")"
                REF_NAME_NORM="$REF_BRANCH"
              fi
              ;;
          esac

          if [ -z "$REF_NAME" ]; then __fail "Cannot determine what was pushed: GITHUB_REF_NAME is empty."; fi
          if [ -z "$REF_COMMIT" ]; then __fail "Cannot determine the commit: GITHUB_SHA is empty."; fi

          echo "ref_type=$REF_TYPE ref_name=$REF_NAME ref_name_norm=$REF_NAME_NORM ref_branch=${REF_BRANCH:-<by history>} ref_commit=$REF_COMMIT"

          {
            echo "ref_type=$REF_TYPE"
            echo "ref_name=$REF_NAME"
            echo "ref_name_norm=$REF_NAME_NORM"
            echo "ref_branch=$REF_BRANCH"
            echo "ref_commit=$REF_COMMIT"
            echo "ref_tag=$REF_TAG"
            echo "ref_tag_branch=$REF_TAG_BRANCH"
          } >> "$GITHUB_OUTPUT"

          {
            echo "REF_TYPE=$REF_TYPE"
            echo "REF_NAME=$REF_NAME"
            echo "REF_NAME_NORM=$REF_NAME_NORM"
            echo "REF_BRANCH=$REF_BRANCH"
            echo "REF_COMMIT=$REF_COMMIT"
          } >> "$GITHUB_ENV"

          unset -f __lower __trim __slug __fail
          unset __event __raw_type __raw_name __pr __head __prefix __vpart
          # <<< .github/snippets/resolve-ref.sh

      - name: Checkout
        if: ${{ steps.ref.outputs.ref_type == 'tag' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref_name }}

      - name: Resolve environment
        id: env
        env:
          MULTIPLE_PACKAGES: ${{ vars.MULTIPLE_PACKAGES }}
          REF_TYPE: ${{ steps.ref.outputs.ref_type }}
          REF_NAME: ${{ steps.ref.outputs.ref_name }}
          REF_BRANCH: ${{ steps.ref.outputs.ref_branch }}
          REF_COMMIT: ${{ steps.ref.outputs.ref_commit }}
          REF_TAG_BRANCH: ${{ steps.ref.outputs.ref_tag_branch }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/resolve-env.sh
          __slug() { printf '%s' "${1:-}" | tr -d '\r' | tr '/' '-'; }
          __trim() { printf '%s' "${1:-}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          __fail() { echo "::error::$1" >&2; exit 1; }

          MULTIPLE_PACKAGES="$(__trim "${MULTIPLE_PACKAGES:-}" | tr '[:upper:]' '[:lower:]')"

          if [ -z "${REF_BRANCH:-}" ]; then
            __found="$(git branch -r --contains "$REF_COMMIT" 2>/dev/null | grep -v HEAD | head -1 | sed 's#.*origin/##' | tr -d '[:space:]' || true)"
            if [ -z "$__found" ]; then
              __fail "Cannot tell which branch tag '$REF_NAME' was cut from: commit $REF_COMMIT is not on any remote branch. Checkout with fetch-depth: 0 is required."
            fi
            REF_BRANCH="$(__slug "$__found")"

          elif [ "$REF_TYPE" = "tag" ] && [ -n "${REF_TAG_BRANCH:-}" ]; then
            if ! git ls-remote --exit-code --heads origin "$REF_TAG_BRANCH" >/dev/null 2>&1; then
              __fail "Branch '$REF_TAG_BRANCH' from tag '$REF_NAME' not found."
            fi
          fi

          __suffix=""
          if [ "$MULTIPLE_PACKAGES" = "true" ]; then __suffix="-${REF_BRANCH}"; fi

          if [ -n "$__suffix" ]; then
            echo "Environment resolved to: '$REF_BRANCH' (package suffix '$__suffix')"
          else
            echo "Environment resolved to: '$REF_BRANCH'"
          fi

          {
            echo "ref_branch=$REF_BRANCH"
            echo "environment=$REF_BRANCH"
            echo "pkg_suffix=$__suffix"
          } >> "$GITHUB_OUTPUT"

          echo "REF_BRANCH=$REF_BRANCH" >> "$GITHUB_ENV"

          unset -f __slug __trim __fail
          unset __found __suffix
          # <<< .github/snippets/resolve-env.sh

  resolve-config:
    needs: resolve-ref
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-ref.outputs.environment }}

    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
      warm_cache: ${{ steps.decide.outputs.warm_cache }}
      run_release: ${{ steps.decide.outputs.run_release }}
      run_cd: ${{ steps.decide.outputs.run_cd }}
      scope: ${{ steps.decide.outputs.scope }}
      commits: ${{ steps.decide.outputs.commits }}
      os_json: ${{ steps.decide.outputs.os_json }}
      publish_method: ${{ steps.decide.outputs.publish_method }}
      deploy_method: ${{ steps.decide.outputs.deploy_method }}
      deploy_mirror: ${{ steps.decide.outputs.deploy_mirror }}
      apt_packages: ${{ steps.decide.outputs.apt_packages }}

    env:
      ACTION_TRIGGER: ${{ vars.ACTION_TRIGGER || 'workflow_dispatch' }}
      BUILD_COMMAND: ${{ vars.BUILD_COMMAND }}
      CI_COMMAND: ${{ vars.CI_COMMAND }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_METHOD: ${{ vars.DEPLOY_METHOD || 'command' }}
      DEPLOY_MIRROR: ${{ (inputs.deploy_mirror != 'default' && inputs.deploy_mirror) || vars.DEPLOY_MIRROR || 'false' }}
      DEPLOY_LAST_COMMITS: ${{ vars.DEPLOY_LAST_COMMITS || 'false' }}

    steps:
      - name: Decide what to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ needs.resolve-ref.outputs.ref_type }}
          REF_NAME_NORM: ${{ needs.resolve-ref.outputs.ref_name_norm }}
          REF_NAME: ${{ needs.resolve-ref.outputs.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_COMMITS: ${{ inputs.commits }}
          PUSH_COMMITS: ${{ join(github.event.commits.*.id, ',') }}
          RUNS_ON: ${{ vars.RUNS_ON }}
          PUBLISH_METHOD: ${{ vars.PUBLISH_METHOD }}
        run: |
          set -euo pipefail

          lower() { printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]'; }
          fail()  { echo "::error::$1" >&2; exit 1; }

          ACTION_TRIGGER="$(lower "$ACTION_TRIGGER")"
          DEPLOY_METHOD="$(lower "$DEPLOY_METHOD")"
          DEPLOY_MIRROR="$(lower "$DEPLOY_MIRROR")"
          DEPLOY_LAST_COMMITS="$(lower "$DEPLOY_LAST_COMMITS")"
          PUBLISH_METHOD="$(lower "${PUBLISH_METHOD:-}")"

          case "$ACTION_TRIGGER" in
            workflow_dispatch|push|branch|tag) ;;
            *) fail "Invalid ACTION_TRIGGER='$ACTION_TRIGGER'. Allowed: workflow_dispatch | push | branch | tag." ;;
          esac

          PR=false
          ACTIVE=false
          case "$REF_TYPE" in
            pr)
              PR=true
              ;;
            tag)
              if [ "$EVENT" = "workflow_dispatch" ]; then
                ACTIVE=true
              elif [ "$EVENT" = "push" ]; then
                case "$ACTION_TRIGGER" in push|tag) ACTIVE=true ;; esac
              fi
              ;;
            branch)
              if [ "$EVENT" = "workflow_dispatch" ]; then
                ACTIVE=true
              elif [ "$EVENT" = "push" ]; then
                case "$ACTION_TRIGGER" in push|branch) ACTIVE=true ;; esac
              fi
              ;;
            *)
              fail "resolve-ref returned REF_TYPE='$REF_TYPE' — expected tag | branch | pr."
              ;;
          esac

          HAVE_CI=false
          if [ -n "${BUILD_COMMAND:-}" ] || [ -n "${CI_COMMAND:-}" ]; then HAVE_CI=true; fi

          HAVE_CD=false
          if [ -n "${DEPLOY_HOST:-}" ] && [ -n "${DEPLOY_USER:-}" ] && [ -n "${DEPLOY_KEY:-}" ] && [ -n "${DEPLOY_PATH:-}" ]; then
            HAVE_CD=true
          fi

          RUN_CI=false
          RUN_RELEASE=false
          RUN_CD=false
          if { [ "$PR" = "true" ] || [ "$ACTIVE" = "true" ]; } && [ "$HAVE_CI" = "true" ]; then RUN_CI=true; fi
          if [ "$ACTIVE" = "true" ] && [ "$REF_TYPE" = "tag" ]; then RUN_RELEASE=true; fi
          if [ "$ACTIVE" = "true" ] && [ "$PR" != "true" ] && [ "$HAVE_CD" = "true" ]; then RUN_CD=true; fi

          # A cache is visible to the ref that saved it and, from the default branch, to
          # every ref: a tag cannot reuse what the previous tag saved. When ci does not
          # run on the default branch, it runs there in warm-up mode instead — installs
          # the toolchain and runs BUILD_COMMAND only to fill missing caches.
          WARM_CACHE=false
          if [ "$RUN_CI" != "true" ] && [ "$HAVE_CI" = "true" ] && [ "$REF_TYPE" = "branch" ] \
            && [ -n "${DEFAULT_BRANCH:-}" ] && [ "${REF_NAME:-}" = "$DEFAULT_BRANCH" ]; then
            WARM_CACHE=true
          fi

          SCOPE=""
          COMMITS=""
          APT_PACKAGES=""
          if [ "$RUN_CD" = "true" ]; then
            case "$DEPLOY_METHOD" in
              command|rsync|ftp|git) ;;
              *) fail "Invalid DEPLOY_METHOD='$DEPLOY_METHOD'. Allowed: command | rsync | ftp | git." ;;
            esac
            case "$DEPLOY_MIRROR" in
              false|true|full) ;;
              *) fail "Invalid DEPLOY_MIRROR='$DEPLOY_MIRROR'. Allowed: false | true | full." ;;
            esac

            if [ "$DEPLOY_METHOD" = "command" ]; then
              SCOPE="none"
            elif [ "$EVENT" = "workflow_dispatch" ]; then
              if [ -z "$INPUT_COMMITS" ]; then
                SCOPE="full"
              else
                SCOPE="selective"; COMMITS="$INPUT_COMMITS"
              fi
            elif [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
              SCOPE="full"
            elif [ "$EVENT" = "push" ]; then
              if [ "$DEPLOY_LAST_COMMITS" = "true" ]; then
                SCOPE="selective"; COMMITS="$PUSH_COMMITS"
              else
                SCOPE="full"
              fi
            fi

            if [ "$SCOPE" = "selective" ]; then
              if [ "$DEPLOY_METHOD" = "git" ]; then
                fail "DEPLOY_METHOD=git is not supported in selective mode (workflow_dispatch with commits or DEPLOY_LAST_COMMITS=true): git deploys the whole branch, not a file subset."
              fi
              if [ "$DEPLOY_MIRROR" = "full" ]; then
                fail "DEPLOY_MIRROR=full is incompatible with selective deploy (DEPLOY_LAST_COMMITS=true or workflow_dispatch with commits): 'full' is an exact mirror of the whole tree, while selective mode works with a subset of files. To delete files removed in the deployed commits, use DEPLOY_MIRROR=true."
              fi
              if [ "$RUN_CI" = "true" ]; then
                echo "::warning::Selective deploy does not ship build results from job 'ci': the file list comes from git history, and built files are not in git. Deploying them requires a full deploy."
              fi
            fi

            # System packages the cd job installs: lftp for FTP, sshpass when DEPLOY_KEY is a password.
            if [ "$DEPLOY_METHOD" = "ftp" ]; then
              APT_PACKAGES="lftp"
            else
              case "${DEPLOY_KEY%%$'\n'*}" in
                -----BEGIN*) ;;
                *) APT_PACKAGES="sshpass" ;;
              esac
            fi
          fi

          OS_LIST="${RUNS_ON:-}"
          if [ -z "$OS_LIST" ]; then OS_LIST="ubuntu-latest"; fi
          OS_JSON=$(printf '%s' "$OS_LIST" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sed 's/\\/\\\\/g; s/"/\\"/g; s/^/"/; s/$/"/' \
            | paste -sd, - || true)
          OS_JSON="[${OS_JSON}]"
          if [ "$OS_JSON" = "[]" ]; then
            fail "RUNS_ON='$OS_LIST' does not contain a single runner."
          fi

          case "${PUBLISH_METHOD:-}" in
            ''|npm|docker|packagist) ;;
            *) fail "Unknown PUBLISH_METHOD='$PUBLISH_METHOD'. Allowed: npm | docker | packagist (empty = do not publish)." ;;
          esac

          echo "ACTION_TRIGGER=$ACTION_TRIGGER event=$EVENT ref_type=$REF_TYPE ref_name_norm=$REF_NAME_NORM active=$ACTIVE pr=$PR"
          echo "run_ci=$RUN_CI run_release=$RUN_RELEASE run_cd=$RUN_CD warm_cache=$WARM_CACHE"
          echo "method=$DEPLOY_METHOD mirror=$DEPLOY_MIRROR scope=$SCOPE commits='$COMMITS' os=$OS_JSON publish=${PUBLISH_METHOD:-<none>} apt=${APT_PACKAGES:-<none>}"
          {
            echo "run_ci=$RUN_CI"
            echo "warm_cache=$WARM_CACHE"
            echo "run_release=$RUN_RELEASE"
            echo "run_cd=$RUN_CD"
            echo "scope=$SCOPE"
            echo "commits=$COMMITS"
            echo "os_json=$OS_JSON"
            echo "publish_method=${PUBLISH_METHOD:-}"
            echo "deploy_method=$DEPLOY_METHOD"
            echo "deploy_mirror=$DEPLOY_MIRROR"
            echo "apt_packages=$APT_PACKAGES"
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: [resolve-ref, resolve-config]
    if: ${{ needs.resolve-config.outputs.run_ci == 'true' || needs.resolve-config.outputs.warm_cache == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.resolve-config.outputs.os_json) }}

    runs-on: ${{ matrix.os }}

    environment: ${{ needs.resolve-ref.outputs.environment }}

    permissions:
      contents: read

    env:
      REF_TYPE: ${{ needs.resolve-ref.outputs.ref_type }}
      REF_NAME: ${{ needs.resolve-ref.outputs.ref_name }}
      REF_NAME_NORM: ${{ needs.resolve-ref.outputs.ref_name_norm }}
      REF_BRANCH: ${{ needs.resolve-ref.outputs.ref_branch }}
      REF_COMMIT: ${{ needs.resolve-ref.outputs.ref_commit }}
      BUILD_COMMAND: ${{ vars.BUILD_COMMAND }}
      CI_COMMAND: ${{ vars.CI_COMMAND }}
      WARM_CACHE: ${{ needs.resolve-config.outputs.warm_cache }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref_type == 'tag' && needs.resolve-ref.outputs.ref_name || '' }}
          submodules: recursive

      - name: Collect vars and secrets
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          EXTRA_SECRETS: ${{ secrets.SECRETS_JSON }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/collect-ctx.sh
          # Writes vars and secrets of the job into a sourceable file and exports CTX_ENV with
          # its path, so user commands see them as ordinary environment variables.
          # Inputs: VARS_JSON, EXTRA_SECRETS (SECRETS_JSON, masked), ALL_SECRETS.
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp="$(cygpath -u "$RUNNER_TEMP")"; fi
          CTX="$tmp/ctx_env.sh"
          : > "$CTX"
          chmod 600 "$CTX"

          DENY='^(PATH|HOME|IFS|PWD|OLDPWD|SHELL|SHELLOPTS|PS[0-9]|BASH.*|LD_.*|GITHUB_.*|RUNNER_.*|ACTIONS_.*|TMP_KEY|GT_SSH|GT_AUTH_MODE|CTX|CTX_ENV|GIT_ASKPASS|GIT_CONFIG.*|GIT_TERMINAL_PROMPT|GIT_AUTH_TOKEN.*|VARS_JSON|ALL_SECRETS|EXTRA_SECRETS|github_token|REF_TYPE|REF_NAME|REF_NAME_NORM|REF_BRANCH|REF_COMMIT|TARGET_COMMIT|PUBLISHED_IMAGE|PUBLISHED_IMAGE_TAG|WARM_CACHE)$'

          emit() {
            local json="$1" mask="$2" label="$3"
            local names="" k b64 v

            if [ -z "$json" ] || [ "$json" = "null" ] || [ "$json" = "{}" ]; then
              echo "$label: <none>"
              return 0
            fi
            if ! printf '%s' "$json" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::$label is not a JSON object. Expected {\"NAME\":\"value\", ...}." >&2
              exit 1
            fi

            while IFS=$'\t' read -r k b64; do
              [ -z "$k" ] && continue
              case "$k" in [A-Za-z_][A-Za-z0-9_]*) ;; *) continue ;; esac
              if printf '%s' "$k" | grep -qE "$DENY"; then continue; fi
              v="$(printf '%s' "$b64" | base64 -d)"
              if [ "$mask" = "mask" ] && [ -n "$v" ]; then
                printf '%s\n' "$v" | while IFS= read -r line; do
                  [ -n "$line" ] && printf '::add-mask::%s\n' "$line"
                done
              fi
              printf 'export %s=%q\n' "$k" "$v" >> "$CTX"
              names="$names $k"
            done < <(printf '%s' "$json" \
              | jq -r 'to_entries[] | .key + "\t" + (.value | tostring | @base64)' \
              | tr -d '\r')

            echo "$label:${names:- <none>}"
          }

          emit "${VARS_JSON:-}"     nomask "vars"
          emit "${EXTRA_SECRETS:-}" mask   "SECRETS_JSON"
          emit "${ALL_SECRETS:-}"   nomask "secrets"

          echo "CTX_ENV=$CTX" >> "$GITHUB_ENV"

          unset -f emit
          unset tmp CTX DENY
          # <<< .github/snippets/collect-ctx.sh

      - name: Resolve caches
        id: resolve
        env:
          TOOLCHAIN: ${{ vars.TOOLCHAIN }}
          MISE_FILES_HASH: ${{ hashFiles('.mise.toml', '.tool-versions') }}
          CACHE_PATHS: ${{ vars.CACHE_PATHS }}
          CACHE_KEY_FILES: ${{ vars.CACHE_KEY_FILES }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/toolchain-resolve.sh
          # Parses TOOLCHAIN ("node:24,php@8.4,ubi:owner/repo@1.2.3") into TOOLS, mise specs
          # "name@version" separated by spaces, and resolves MISE_DIR, where mise keeps the
          # installs, and TOOLCHAIN_KEY, the cache key of that directory.
          # Inputs: TOOLCHAIN, MISE_FILES_HASH (hashFiles of .mise.toml and .tool-versions).
          __backends="ubi,aqua,asdf,cargo,go,npm,pipx,gem,dotnet,spm,vfox,http"
          TOOLS=""
          while IFS= read -r __item; do
            __item="$(printf '%s' "$__item" | tr -d '[:space:]')"
            if [ -z "$__item" ]; then continue; fi
            __prefix="${__item%%:*}"
            __rest="${__item#*:}"
            if [ "$__prefix" != "$__item" ] && [[ ",$__backends," == *",$__prefix,"* ]] && [[ "$__rest" == */* ]]; then
              __after="${__rest##*/}"
              if [[ "$__after" == *@* ]]; then
                __ver="${__after##*@}"; __name="$__prefix:${__rest%@*}"
              else
                __ver="latest"; __name="$__prefix:$__rest"
              fi
            elif [[ "$__item" == *@* ]]; then
              __name="${__item%@*}"; __ver="${__item##*@}"
            elif [ "$__prefix" != "$__item" ]; then
              __name="$__prefix"; __ver="$__rest"
            else
              __name="$__item"; __ver="latest"
            fi
            TOOLS="$TOOLS $__name@$__ver"
          done <<< "$(printf '%s' "${TOOLCHAIN:-}" | tr ',' '\n')"
          TOOLS="${TOOLS# }"

          if [ -z "$TOOLS" ]; then
            echo "TOOLCHAIN is not set — skipping tool installation."
          else
            echo "Tools: $TOOLS"
          fi

          if [ -n "${MISE_DATA_DIR:-}" ]; then
            MISE_DIR="$MISE_DATA_DIR"
          elif [ -n "${XDG_DATA_HOME:-}" ]; then
            MISE_DIR="$XDG_DATA_HOME/mise"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            MISE_DIR="$LOCALAPPDATA/mise"
          else
            MISE_DIR="$HOME/.local/share/mise"
          fi
          MISE_DIR="$(printf '%s' "$MISE_DIR" | tr '\\' '/')"

          # The key is shared by every job that installs the toolchain; keep its format stable,
          # or caches already saved on the default branch stop matching.
          # TOOLCHAIN_BUILD is bumped when the way tools are built changes (toolchain-deps.sh: system
          # libraries, configure options): a cached build made the old way would be restored and never
          # rebuilt. 2 — PHP with sodium.
          TOOLCHAIN_BUILD=2
          TOOLCHAIN_KEY="mise-${RUNNER_OS}-${RUNNER_ARCH}-b${TOOLCHAIN_BUILD}-${MISE_FILES_HASH:-}-${TOOLS}"

          unset __backends __item __prefix __rest __after __ver __name TOOLCHAIN_BUILD
          # <<< .github/snippets/toolchain-resolve.sh

          # >>> .github/snippets/dep-cache-resolve.sh
          # Resolves the dependency cache from CACHE_PATHS and CACHE_KEY_FILES into DEP_PATHS
          # (one path per line), DEP_KEY and DEP_KEY_PREFIX. Empty CACHE_PATHS leaves all three
          # empty, which switches the cache steps off.
          # Inputs: CACHE_PATHS, CACHE_KEY_FILES.
          DEP_PATHS=""
          DEP_KEY=""
          DEP_KEY_PREFIX=""

          __split() {
            printf '%s' "${1:-}" \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
              | grep -v '^$' || true
          }

          __sha() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum; else shasum -a 256; fi
          }

          if [ -z "${CACHE_PATHS:-}" ]; then
            echo "CACHE_PATHS is not set — skipping the dependency cache."
          else
            DEP_PATHS="$(__split "$CACHE_PATHS")"
            if [ -z "$DEP_PATHS" ]; then
              echo "::error::CACHE_PATHS='$CACHE_PATHS' does not contain a single path." >&2
              exit 1
            fi

            __patterns="$(__split "${CACHE_KEY_FILES:-}")"
            if [ -z "$__patterns" ]; then
              echo "::error::CACHE_PATHS is set, but CACHE_KEY_FILES is empty. Without key files the cache would be saved once and never refreshed — list the lock files the dependencies come from, e.g. 'package-lock.json'." >&2
              exit 1
            fi

            shopt -s globstar nullglob dotglob

            __files=()
            while IFS= read -r __pattern; do
              [ -z "$__pattern" ] && continue
              eval "__matches=( $__pattern )"
              for __f in "${__matches[@]}"; do
                [ -f "$__f" ] && __files+=("$__f")
              done
            done <<< "$__patterns"

            shopt -u globstar nullglob dotglob

            if [ ${#__files[@]} -eq 0 ]; then
              echo "::error::No files matched CACHE_KEY_FILES: $CACHE_KEY_FILES" >&2
              exit 1
            fi

            __hash=$(
              printf '%s\n' "${__files[@]}" | LC_ALL=C sort -u | while IFS= read -r __f; do
                printf '%s  %s\n' "$(__sha < "$__f" | cut -d' ' -f1)" "$__f"
              done | __sha | cut -c1-64
            )

            DEP_KEY_PREFIX="deps-${RUNNER_OS}-${RUNNER_ARCH}-"
            DEP_KEY="${DEP_KEY_PREFIX}${__hash}"

            echo "Cache paths:"
            printf '%s\n' "$DEP_PATHS" | sed 's/^/  /'
            echo "Key files:"
            printf '%s\n' "${__files[@]}" | LC_ALL=C sort -u | sed 's/^/  /'
            echo "Key: $DEP_KEY"
          fi

          unset -f __split __sha
          unset __patterns __pattern __files __matches __f __hash
          # <<< .github/snippets/dep-cache-resolve.sh

          {
            echo "tools=$TOOLS"
            echo "mise_dir=$MISE_DIR"
            echo "toolchain_key=$TOOLCHAIN_KEY"
            echo "dep_paths<<EOF"
            printf '%s\n' "$DEP_PATHS"
            echo "EOF"
            echo "dep_key=$DEP_KEY"
            echo "dep_key_prefix=$DEP_KEY_PREFIX"
          } >> "$GITHUB_OUTPUT"

      # In warm-up mode (WARM_CACHE, see resolve-config) the job only fills these caches
      # on the default branch: the toolchain is installed on a miss, BUILD_COMMAND runs
      # only when the dependency key missed, CI_COMMAND is skipped.
      - name: Cache toolchain
        id: toolchain-cache
        if: ${{ steps.resolve.outputs.tools != '' }}
        uses: actions/cache@v6
        with:
          path: ${{ steps.resolve.outputs.mise_dir }}
          key: ${{ steps.resolve.outputs.toolchain_key }}

      - name: Cache dependencies
        id: deps-cache
        if: ${{ steps.resolve.outputs.dep_key != '' && (env.WARM_CACHE != 'true' || env.BUILD_COMMAND != '') }}
        uses: actions/cache@v6
        with:
          path: ${{ steps.resolve.outputs.dep_paths }}
          key: ${{ steps.resolve.outputs.dep_key }}
          restore-keys: ${{ steps.resolve.outputs.dep_key_prefix }}

      - name: Install toolchain
        if: ${{ steps.resolve.outputs.tools != '' && (env.WARM_CACHE != 'true' || steps.toolchain-cache.outputs.cache-hit != 'true' || (steps.deps-cache.outcome == 'success' && steps.deps-cache.outputs.cache-hit != 'true')) }}
        env:
          TOOLS: ${{ steps.resolve.outputs.tools }}
          MISE_DIR: ${{ steps.resolve.outputs.mise_dir }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/mise-download.sh
          # Downloads the mise binary into MISE_BIN_DIR and sets MISE to its path. The CDN serves
          # the latest release; when it is down, the version comes from the VERSION endpoint or
          # the GitHub API, and as a last resort a pinned release is used.
          # Inputs: GH_TOKEN (optional, for the GitHub API).
          case "$RUNNER_OS" in
            Linux)   __os=linux ;;
            macOS)   __os=macos ;;
            Windows) __os=windows ;;
            *) echo "::error::Unsupported OS RUNNER_OS='$RUNNER_OS'." >&2; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   __arch=x64 ;;
            ARM64) __arch=arm64 ;;
            *) echo "::error::Unsupported architecture RUNNER_ARCH='$RUNNER_ARCH'." >&2; exit 1 ;;
          esac
          __ext=""
          if [ "$__os" = "windows" ]; then __ext=".exe"; fi

          __tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then __tmp="$(cygpath -u "$RUNNER_TEMP")"; fi
          MISE_BIN_DIR="$__tmp/mise-bin"
          mkdir -p "$MISE_BIN_DIR"
          MISE="$MISE_BIN_DIR/mise${__ext}"

          MISE_FALLBACK_VERSION="v2026.7.12"

          __try_download() {
            echo "  trying $1"
            curl -fsSL --retry 3 --retry-delay 2 -o "$MISE" "$1" 2>/dev/null || return 1
            chmod +x "$MISE" 2>/dev/null || true
            "$MISE" --version >/dev/null 2>&1 || return 1
            return 0
          }

          __release_url() {
            printf 'https://github.com/jdx/mise/releases/download/%s/mise-%s-%s-%s%s' "$1" "$1" "$__os" "$__arch" "$__ext"
          }

          __ok=false
          echo "Resolving mise version…"
          if __try_download "https://mise.jdx.dev/mise-latest-${__os}-${__arch}${__ext}"; then
            __ok=true
          else
            echo "::warning::The mise CDN is unavailable — trying the VERSION endpoint and the GitHub API."
            __ver=$(curl -fsSL --retry 2 https://mise.jdx.dev/VERSION 2>/dev/null | tr -d '[:space:]' || true)
            if [ -n "$__ver" ]; then
              case "$__ver" in v*) ;; *) __ver="v$__ver" ;; esac
              if __try_download "$(__release_url "$__ver")"; then __ok=true; fi
            fi
            if [ "$__ok" != "true" ]; then
              __api="https://api.github.com/repos/jdx/mise/releases/latest"
              if [ -n "${GH_TOKEN:-}" ]; then
                __body=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$__api" 2>/dev/null || true)
              else
                __body=$(curl -fsSL "$__api" 2>/dev/null || true)
              fi
              __ver=$(printf '%s' "$__body" | grep -m1 '"tag_name"' | sed 's/.*"tag_name"[^"]*"\([^"]*\)".*/\1/' || true)
              if [ -n "$__ver" ] && __try_download "$(__release_url "$__ver")"; then __ok=true; fi
            fi
            if [ "$__ok" != "true" ]; then
              echo "::warning::Neither the CDN nor the API responded — falling back to the pinned version $MISE_FALLBACK_VERSION."
              if __try_download "$(__release_url "$MISE_FALLBACK_VERSION")"; then __ok=true; fi
            fi
          fi

          if [ "$__ok" != "true" ]; then
            echo "::error::Failed to download mise. Check the runner's access to github.com and mise.jdx.dev." >&2
            exit 1
          fi
          echo "mise $("$MISE" --version)"

          unset -f __try_download __release_url
          unset __os __arch __ext __tmp __ok __ver __api __body
          # <<< .github/snippets/mise-download.sh

          # >>> .github/snippets/toolchain-deps.sh
          # Some mise plugins build a tool from source and expect the system libraries
          # to be present. The built binary links against them dynamically, so they are
          # installed on every run, including a toolchain cache hit.
          __pkgs=()
          if [ "${RUNNER_OS:-}" = "Linux" ] && command -v apt-get >/dev/null 2>&1; then
            for __t in ${TOOLS:-}; do
              __n="${__t%@*}"
              case "$__n" in
                php|*/php|*-php)
                  __pkgs+=(build-essential autoconf bison re2c pkg-config
                    libxml2-dev libssl-dev libicu-dev libzip-dev libonig-dev libcurl4-openssl-dev
                    libpng-dev libjpeg-dev libfreetype-dev libwebp-dev libgmp-dev libsodium-dev
                    libreadline-dev libbz2-dev libsqlite3-dev libpq-dev libgd-dev)
                  # mise builds PHP with vfox-php, which passes --with-sodium only on macOS: on Linux
                  # libsodium-dev alone leaves PHP without the sodium extension. The flag goes into
                  # PHP_EXTRA_CONFIGURE_OPTIONS, which vfox-php appends to its own options;
                  # PHP_CONFIGURE_OPTIONS would replace them all (mbstring, intl, gd would be gone).
                  case " ${PHP_EXTRA_CONFIGURE_OPTIONS:-} " in
                    *" --with-sodium"*) ;;
                    *) export PHP_EXTRA_CONFIGURE_OPTIONS="${PHP_EXTRA_CONFIGURE_OPTIONS:+$PHP_EXTRA_CONFIGURE_OPTIONS }--with-sodium" ;;
                  esac
                  ;;
              esac
            done
          fi

          # Arrays are expanded only when non-empty: macOS runners ship bash 3.2, where
          # "${a[@]}" of an empty array trips set -u.
          if [ "${#__pkgs[@]}" -gt 0 ]; then
            __missing=()
            for __p in "${__pkgs[@]}"; do
              if [ "${#__missing[@]}" -gt 0 ]; then
                case " ${__missing[*]} " in *" $__p "*) continue ;; esac
              fi
              if ! dpkg-query -W -f='${Status}' "$__p" 2>/dev/null | grep -q 'install ok installed'; then
                __missing+=("$__p")
              fi
            done

            if [ "${#__missing[@]}" -eq 0 ]; then
              echo "Toolchain build dependencies already present."
            else
              echo "Installing toolchain build dependencies: ${__missing[*]}"
              sudo apt-get update -q
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${__missing[@]}"
            fi
          fi

          unset __pkgs __missing __p __t __n
          # <<< .github/snippets/toolchain-deps.sh

          # >>> .github/snippets/mise-use.sh
          # Installs TOOLS with mise and puts them on PATH for the following steps. A tool
          # already in MISE_DIR (restored from the toolchain cache) is not installed again.
          # Inputs: MISE, MISE_BIN_DIR, MISE_DIR, TOOLS.
          export MISE_YES=1 MISE_PYTHON_COMPILE=false
          # shellcheck disable=SC2086 # TOOLS is a list of specs
          "$MISE" use --global $TOOLS
          "$MISE" ls --installed

          {
            "$MISE" bin-paths 2>/dev/null || true
            printf '%s\n%s\n' "$MISE_DIR/shims" "$MISE_BIN_DIR"
          } | while IFS= read -r __p; do
            [ -z "$__p" ] && continue
            if command -v cygpath >/dev/null 2>&1; then __p="$(cygpath -w "$__p")"; fi
            printf '%s\n' "$__p" >> "$GITHUB_PATH"
          done
          # <<< .github/snippets/mise-use.sh

      - name: Build and test
        if: ${{ (env.WARM_CACHE != 'true' && (env.BUILD_COMMAND != '' || env.CI_COMMAND != '')) || (env.WARM_CACHE == 'true' && steps.deps-cache.outcome == 'success' && steps.deps-cache.outputs.cache-hit != 'true') }}
        env:
          MATRIX_OS: ${{ matrix.os }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${CTX_ENV:-}" ] && [ -f "$CTX_ENV" ]; then . "$CTX_ENV"; fi

          # Each command runs in its own subshell: a `cd` or `exit` in BUILD_COMMAND
          # must not leak into CI_COMMAND.
          if [ -n "${BUILD_COMMAND:-}" ]; then
            echo "=== Build ==="
            ( eval "${BUILD_COMMAND//$'\r'/}" )
          fi
          if [ -n "${CI_COMMAND:-}" ] && [ "${WARM_CACHE:-}" != "true" ]; then
            echo "=== Test ==="
            ( eval "${CI_COMMAND//$'\r'/}" )
          fi

      # upload-artifact drops file modes: without tar, executables in node_modules/.bin,
      # esbuild/swc binaries and build scripts arrive downstream without +x (EACCES).
      - name: Pack workspace
        id: pack
        if: ${{ needs.resolve-config.outputs.run_release == 'true' || (needs.resolve-config.outputs.run_cd == 'true' && needs.resolve-config.outputs.scope == 'full') }}
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -u "$dir")"; fi
          out="$dir/workspace-$MATRIX_OS.tar"
          tar -cf "$out" --exclude=./.git .
          ls -l "$out"
          echo "path=$RUNNER_TEMP/workspace-$MATRIX_OS.tar" >> "$GITHUB_OUTPUT"

      - name: Upload workspace
        if: ${{ steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-${{ matrix.os }}
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Clean up
        if: always()
        run: |
          set +e
          [ -n "${CTX_ENV:-}" ] && rm -f "$CTX_ENV"
          exit 0

  release-publish:
    needs: [resolve-ref, resolve-config, ci]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-ref.outputs.environment }}

    env:
      RELEASE_FILES: ${{ vars.RELEASE_FILES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref_name }}
          submodules: recursive

      - name: Download workspace
        id: workspace
        if: ${{ needs.resolve-config.outputs.run_ci == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: workspace-*
          merge-multiple: true
          path: ${{ runner.temp }}/workspace

      - name: Unpack workspace
        if: ${{ steps.workspace.outcome == 'success' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tars=( "$RUNNER_TEMP"/workspace/workspace-*.tar )
          if [ ${#tars[@]} -eq 0 ]; then
            echo "::error::Artifact workspace-* contains no workspace-*.tar." >&2
            exit 1
          fi
          for t in "${tars[@]}"; do
            echo "Unpacking $(basename "$t")"
            tar -xf "$t" -C .
          done
          rm -rf "$RUNNER_TEMP/workspace"

      - name: Stage release assets
        id: stage
        if: ${{ env.RELEASE_FILES != '' }}
        env:
          RUN_CI: ${{ needs.resolve-config.outputs.run_ci }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          out=".release-staging"
          rm -rf "$out"
          mkdir -p "$out"

          set -f
          patterns=( ${RELEASE_FILES//[,$'\r']/ } )
          set +f

          staged=()
          for pattern in "${patterns[@]}"; do
            base="${pattern%%[*?[{]*}"
            eval "matches=( $pattern )"
            for f in "${matches[@]}"; do
              [ -f "$f" ] || continue
              rel="${f#"$base"}"
              if [ -z "$rel" ] || [ "$rel" = "$f" ]; then
                rel="$(basename "$f")"
              fi
              flat="${rel//\//__}"
              cp "$f" "$out/$flat"
              staged+=("$out/$flat")
            done
          done
          if [ ${#staged[@]} -eq 0 ]; then
            echo "::error::No files matched RELEASE_FILES: $RELEASE_FILES" >&2
            if [ "$RUN_CI" != "true" ]; then
              echo "::error::Job 'ci' did not run (run_ci=$RUN_CI), so there are no build results in the tree — only committed files are searched." >&2
            fi
            exit 1
          fi
          echo "Staged files: ${#staged[@]}"
          printf '  %s\n' "${staged[@]}"
          {
            echo "files<<EOF"
            printf '%s\n' "${staged[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-ref.outputs.ref_name }}
          name: ${{ needs.resolve-ref.outputs.pkg_suffix != '' && format('{0} release {1}', needs.resolve-ref.outputs.environment, needs.resolve-ref.outputs.ref_tag) || format('Release {0}', needs.resolve-ref.outputs.ref_tag) }}
          generate_release_notes: true
          files: ${{ steps.stage.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: [resolve-ref, resolve-config, release-publish]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.run_release == 'true' && needs.resolve-config.outputs.publish_method == 'npm' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-ref.outputs.environment }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref_name }}
          submodules: recursive

      - name: Download workspace
        id: workspace
        if: ${{ needs.resolve-config.outputs.run_ci == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: workspace-*
          merge-multiple: true
          path: ${{ runner.temp }}/workspace

      - name: Unpack workspace
        if: ${{ steps.workspace.outcome == 'success' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tars=( "$RUNNER_TEMP"/workspace/workspace-*.tar )
          if [ ${#tars[@]} -eq 0 ]; then
            echo "::error::Artifact workspace-* contains no workspace-*.tar." >&2
            exit 1
          fi
          for t in "${tars[@]}"; do
            echo "Unpacking $(basename "$t")"
            tar -xf "$t" -C .
          done
          rm -rf "$RUNNER_TEMP/workspace"

      - name: Resolve node version
        id: tc
        env:
          TOOLCHAIN: ${{ vars.TOOLCHAIN }}
        run: |
          set -euo pipefail
          node=""
          while IFS= read -r it; do
            it="$(printf '%s' "$it" | tr -d '[:space:]')"
            if [ -z "$it" ]; then continue; fi
            name="${it%%[:@]*}"
            if [ "$name" = "$it" ]; then ver=""; else ver="${it#*[:@]}"; fi
            if [ "$name" = "node" ]; then
              if [ -n "$ver" ]; then node="$ver"; else node="lts/*"; fi
            fi
          done <<< "$(printf '%s' "${TOOLCHAIN:-}" | tr ',' '\n')"
          if [ -z "$node" ]; then
            node="lts/*"
            echo "::notice::TOOLCHAIN does not specify node — using lts/* for publishing."
          fi
          echo "node=$node" >> "$GITHUB_OUTPUT"

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.tc.outputs.node }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'
          package-manager-cache: false

      - name: Prepare package
        env:
          TAG: ${{ needs.resolve-ref.outputs.ref_tag }}
          SUFFIX: ${{ needs.resolve-ref.outputs.pkg_suffix }}
        run: |
          set -euo pipefail

          # A committed .npmrc would override the registry setup-node configured.
          rm -f .npmrc

          if [[ ! "$TAG" =~ ^v([0-9]+(\.[0-9]+)*)$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag (expected v#, v#.#, v#.#.#)." >&2
            exit 1
          fi
          NUM="${BASH_REMATCH[1]}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NUM"
          VERSION="${MAJOR:-0}.${MINOR:-0}.${PATCH:-0}"
          echo "Tag $TAG -> package version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          if [ -n "$SUFFIX" ]; then
            NAME=$(node -p "require('./package.json').name")
            echo "MULTIPLE_PACKAGES: $NAME -> ${NAME}${SUFFIX}"
            npm pkg set name="${NAME}${SUFFIX}"
          fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$REPO_PRIVATE" = "true" ]; then ACCESS="restricted"; else ACCESS="public"; fi
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          URL="https://npm.pkg.github.com"
          npm pkg delete publishConfig.registry >/dev/null 2>&1 || true
          if npm view "$PKG@$VERSION" version --registry "$URL" >/dev/null 2>&1; then
            echo "$PKG@$VERSION already exists in GitHub Packages — skipping."
          else
            echo "npm publish --registry $URL --access $ACCESS"
            if ! npm publish --registry "$URL" --access "$ACCESS"; then
              echo "::group::npm debug log"
              cat "$(ls -t ~/.npm/_logs/*-debug-*.log 2>/dev/null | head -1)" 2>/dev/null || echo "(debug log not found)"
              echo "::endgroup::"
              exit 1
            fi
          fi

      - name: Set up Node for npmjs.org
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.tc.outputs.node }}
          registry-url: 'https://registry.npmjs.org'
          scope: '@${{ github.repository_owner }}'
          package-manager-cache: false

      - name: Publish to npmjs.org
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          NODE_AUTH_TOKEN: ''
          ENVIRONMENT: ${{ needs.resolve-ref.outputs.environment }}
        run: |
          set -euo pipefail

          # Trusted publishing (OIDC) needs a recent npm CLI.
          npm install -g npm@latest

          if [ "$REPO_PRIVATE" = "true" ]; then ACCESS="restricted"; else ACCESS="public"; fi
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          URL="https://registry.npmjs.org"
          if npm view "$PKG@$VERSION" version --registry "$URL" >/dev/null 2>&1; then
            echo "$PKG@$VERSION already exists in npmjs.org — skipping."
          else
            echo "npm publish --registry $URL --access $ACCESS (trusted publishing / OIDC)"
            if ! npm publish --registry "$URL" --access "$ACCESS"; then
              echo "::group::npm debug log"
              cat "$(ls -t ~/.npm/_logs/*-debug-*.log 2>/dev/null | head -1)" 2>/dev/null || echo "(debug log not found)"
              echo "::endgroup::"
              echo "::error::npmjs.org rejected $PKG@$VERSION. Check the package's Trusted Publisher on npmjs.com: repository '$GITHUB_REPOSITORY', workflow filename = the calling workflow in that repository (e.g. ci-cd.yml), environment empty or '${ENVIRONMENT}'. The package must already exist on npmjs (first publish is manual)." >&2
              exit 1
            fi
          fi

  docker-publish:
    needs: [resolve-ref, resolve-config, release-publish]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.run_release == 'true' && needs.resolve-config.outputs.publish_method == 'docker' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-ref.outputs.environment }}

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.version }}

