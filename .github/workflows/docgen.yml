name: Generate docs structure

on:
  push:
    branches: ['**']
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: write

jobs:
  docgen:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git user for commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate docs structure
        run: |
          set -euo pipefail

          DOCS_DIR="docs"
          DOCIGNORE="$DOCS_DIR/.docignore"

          mkdir -p "$DOCS_DIR"

          if [ ! -f "$DOCIGNORE" ]; then
            cat > "$DOCIGNORE" << 'IGNORE_EOF'
          # ╔═══════════════════════════════════════════════════════════════╗
          # ║              AUTO-DOCUMENTATION SYSTEM — HOW IT WORKS         ║
          # ╚═══════════════════════════════════════════════════════════════╝
          #
          # On every push the GitHub Action (docgen.yml) walks all project files
          # and recreates a mirror structure inside docs/:
          #
          #   src/app.php       ->  docs/src/app.php.md
          #   src/utils/math.js ->  docs/src/utils/math.js.md
          #   style.css         ->  docs/style.css.md
          #
          # Every folder inside docs/ gets a README.md — an index with links to all
          # files and subfolders of that level.
          #
          # --- HOW TO ADD DOCUMENTATION ----------------------------------------------
          #
          # A file page (docs/<path>.md) is created ONCE, with a heading, and is never
          # touched by the automation again. Write anywhere in it; no markers needed.
          #
          # The <!-- DOCGEN:START/END --> markers matter ONLY in folder README.md files:
          # the block between them is regenerated, while text above START and below END
          # is preserved.
          #
          # Example (docs/src/README.md):
          #
          #   <!-- DOCGEN:START -->
          #   # src
          #   ...generated index...
          #   <!-- DOCGEN:END -->
          #                             <- anything written here is kept forever
          #   ## Description
          #   Application entry point. Initializes the config and the router.
          #
          # --- HOW UPDATES WORK ------------------------------------------------------
          #
          # * New file in the repo   -> a matching .md is created (heading only)
          # * File removed from repo -> its .md is removed too, empty folders pruned
          # * Existing file page     -> never overwritten
          # * README.md in folders   -> only the DOCGEN:START/END block is refreshed;
          #                             if there are no markers, it is prepended
          #
          # --- HOW TO CONFIGURE FILTERING (.docignore) -------------------------------
          #
          # This file (.docignore) is a blacklist — list what to exclude.
          # Supported forms (.gitignore syntax):
          #
          #   *.ext            - all files with the extension  (example: *.png)
          #   dirname/         - the whole folder              (example: node_modules/)
          #   filename         - a file by name, at any depth  (example: package-lock.json)
          #   path/to/file     - path from the repo root       (example: src/app.js)
          #   dir/*.js         - files in a folder, not nested (example: dist/*.js)
          #   dir/**           - everything inside, recursive   (example: dist/**)
          #   dir/**/*.js      - a mask at any depth            (example: dist/**/*.min.js)
          #   *                - any characters except /        (example: build-*.log)
          #   **               - any characters including /     (example: **/tmp)
          #   ?                - one character except /         (example: file?.txt)
          #   !pattern         - negate a previous rule         (example: !examples/)
          #   # comment        - lines starting with # are ignored
          #
          # A pattern containing a slash is anchored to the repo root; without a slash
          # it matches at any depth (as in .gitignore). Rules are applied in order and
          # the last match wins. Matching is case-insensitive.
          #
          # The file is created automatically on the first run and never overwritten.
          # Edit it freely — changes take effect on the next push.
          # Note: once a file becomes excluded, its page in docs/ is deleted along with
          # whatever text was written in it.
          #
          # ════════════════════════════════════════════════════════════════════════════
          #
          # ═══════════════════════════════════════════════
          # Blacklist for docs generation
          # Syntax: *.ext, dirname/, filename, !negation. Comments: #
          # ═══════════════════════════════════════════════

          # Images
          *.png
          *.jpg
          *.jpeg
          *.gif
          *.bmp
          *.ico
          *.webp
          *.tiff
          *.tif
          *.svg
          *.avif
          *.heic
          *.heif
          *.raw
          *.cr2
          *.nef

          # Documents
          *.doc
          *.md
          *.docx
          *.pdf
          *.xls
          *.xlsx
          *.ppt
          *.pptx
          *.odt
          *.ods
          *.odp
          *.rtf
          *.epub
          LICENSE
          .npmrc

          # Audio
          *.mp3
          *.wav
          *.ogg
          *.flac
          *.aac
          *.wma
          *.m4a

          # Video
          *.mp4
          *.avi
          *.mov
          *.wmv
          *.flv
          *.mkv
          *.webm
          *.m4v
          *.mpeg
          *.mpg

          # Fonts
          *.ttf
          *.otf
          *.woff
          *.woff2
          *.eot

          # Archives
          *.zip
          *.rar
          *.7z
          *.tar
          *.gz
          *.bz2
          *.xz
          *.tgz

          # Binaries & executables
          *.exe
          *.dll
          *.so
          *.dylib
          *.bin
          *.msi
          *.dmg
          *.deb
          *.rpm
          *.app

          # Compiled / object files
          *.o
          *.obj
          *.pyc
          *.pyo
          *.class
          *.jar
          *.war

          # Design files
          *.psd
          *.ai
          *.sketch
          *.fig
          *.xd

          # Database
          *.sqlite
          *.db
          *.mdb

          # Source maps & minified
          *.map
          *.min.js
          *.min.css

          # Lock files
          .dockerignore
          .gitignore
          package-lock.json
          yarn.lock
          composer.lock
          Gemfile.lock
          poetry.lock
          pnpm-lock.yaml
          __init__.py
          pyproject.toml

          # Directories
          node_modules/
          vendor/
          .venv/
          venv/
          dist/
          build/
          .git/
          .github/
          docs/
          __pycache__/
          .cache/
          .tmp/
          .vscode/
          .idea/
          bower_components/
          IGNORE_EOF
            sed -i 's/^          //' "$DOCIGNORE"
            echo "Created default $DOCIGNORE"
          fi

          RULES_PATTERN=()
          RULES_NEGATE=()

          # Translate a glob body (no leading !, no leading/trailing /) into ERE.
          # Supports: ** (any chars incl. /), * (any chars except /), ? (one char
          # except /). Every other character is escaped to match literally.
          glob_to_regex() {
            local glob="$1"
            local re="" i=0 n=${#glob} c nxt
            while (( i < n )); do
              c="${glob:i:1}"
              case "$c" in
                '*')
                  nxt="${glob:i+1:1}"
                  if [[ "$nxt" == "*" ]]; then
                    i=$((i+1))
                    nxt="${glob:i+1:1}"
                    if [[ "$nxt" == "/" ]]; then
                      i=$((i+1))
                      re+="(.*/)?"   # **/  → zero or more directories
                    else
                      re+=".*"        # **   → anything including /
                    fi
                  else
                    re+="[^/]*"       # *    → anything except /
                  fi
                  ;;
                '?')
                  re+="[^/]"          # ?    → one char except /
                  ;;
                [a-zA-Z0-9_/-])
                  re+="$c"
                  ;;
                *)
                  re+="\\"            # escape regex-special / literal char
                  re+="$c"
                  ;;
              esac
              i=$((i+1))
            done
            printf '%s' "$re"
          }

          parse_rules() {
            RULES_PATTERN=()
            RULES_NEGATE=()
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [[ -z "$line" || "$line" == \#* ]] && continue

              local negate=false
              if [[ "$line" == \!* ]]; then
                negate=true
                line="${line#!}"
              fi

              local anchored=false dir_only=false
              if [[ "$line" == /* ]]; then
                anchored=true
                line="${line#/}"
              fi
              if [[ "$line" == */ ]]; then
                dir_only=true
                line="${line%/}"
              fi
              # A pattern containing a slash is anchored to the repo root,
              # otherwise it matches at any depth (gitignore semantics).
              [[ "$line" == */* ]] && anchored=true
              [[ -z "$line" ]] && continue

              local body prefix suffix
              body="$(glob_to_regex "$line")"
              if [[ "$anchored" == "true" ]]; then prefix="^"; else prefix="(^|/)"; fi
              if [[ "$dir_only" == "true" ]]; then suffix="/"; else suffix="(\$|/)"; fi

              RULES_PATTERN+=("${prefix}${body}${suffix}")
              RULES_NEGATE+=("$negate")
            done < "$1"
          }

          is_excluded() {
            local filepath="$1"
            local state=1
            local i
            for (( i=0; i<${#RULES_PATTERN[@]}; i++ )); do
              if echo "$filepath" | grep -qiE "${RULES_PATTERN[$i]}"; then
                if [[ "${RULES_NEGATE[$i]}" == "true" ]]; then
                  state=1
                else
                  state=0
                fi
              fi
            done
            return $state
          }

          parse_rules "$DOCIGNORE"

          mapfile -t ALL_FILES < <(
            while IFS= read -r file; do
              is_excluded "$file" || echo "$file"
            done < <(
              find . -not -path './docs/*' -not -path './.git/*' -type f \
                | sed 's|^\./||' \
                | sort
            )
          )

          TMPDIR_WORK="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR_WORK"' EXIT

          printf '%s\n' "${ALL_FILES[@]}" | sort > "$TMPDIR_WORK/source.txt"

          find "$DOCS_DIR" -type f -name '*.md' ! -name 'README.md' -printf '%P\n' \
            | sed 's/\.md$//' | sort > "$TMPDIR_WORK/existing.txt"

          comm -23 "$TMPDIR_WORK/existing.txt" "$TMPDIR_WORK/source.txt" > "$TMPDIR_WORK/orphans.txt"
          comm -23 "$TMPDIR_WORK/source.txt" "$TMPDIR_WORK/existing.txt" > "$TMPDIR_WORK/new.txt"

          orphan_count=0
          while IFS= read -r orphan; do
            [[ -z "$orphan" ]] && continue
            md_path="$DOCS_DIR/${orphan}.md"
            if [ -f "$md_path" ]; then
              rm -f "$md_path"
              echo "  DELETE: $md_path"
              ((orphan_count++)) || true
            fi
          done < "$TMPDIR_WORK/orphans.txt"

          find "$DOCS_DIR" -mindepth 1 -type d -empty -delete 2>/dev/null || true

          new_count=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            md_path="$DOCS_DIR/${file}.md"

            [ -f "$md_path" ] && continue
            mkdir -p "$(dirname "$md_path")"
            filename="$(basename "$file")"
            echo "# ${filename}" > "$md_path"
            echo "  CREATE: $md_path"
            ((new_count++)) || true
          done < "$TMPDIR_WORK/new.txt"

          generate_index() {
            local dir="$1"
            local readme="$dir/README.md"

            if [[ "$dir" == "$DOCS_DIR" ]]; then
              local title="${GITHUB_REPOSITORY##*/}"
            else
              local title
              title="$(basename "$dir")"
            fi

            local subdirs=()
            while IFS= read -r subdir; do
              [[ -z "$subdir" ]] && continue
              subdirs+=("$(basename "$subdir")")
            done < <(find "$dir" -maxdepth 1 -mindepth 1 -type d | sort)

            local files=()
            while IFS= read -r entry; do
              [[ -z "$entry" ]] && continue
              local name
              name="$(basename "$entry")"
              [[ "$name" == "README.md" ]] && continue
              files+=("$name")
            done < <(find "$dir" -maxdepth 1 -mindepth 1 -type f -name '*.md' | sort)

            local auto_tmp
            auto_tmp="$(mktemp)"

            {
              echo "<!-- DOCGEN:START -->"
              echo "# ${title}"
              echo ""

              if [[ ${#subdirs[@]} -gt 0 ]]; then
                echo "## Папки"
                echo ""
                for d in "${subdirs[@]}"; do
                  echo "- [${d}](${d}/)"
                done
                echo ""
              fi

              if [[ ${#files[@]} -gt 0 ]]; then
                echo "## Файлы"
                echo ""
                for f in "${files[@]}"; do
                  local original_name="${f%.md}"
                  echo "- [${original_name}](${f})"
                done
                echo ""
              fi

              echo "<!-- DOCGEN:END -->"
            } > "$auto_tmp"

            if [ ! -f "$readme" ]; then
              mv "$auto_tmp" "$readme"
            else
              if grep -q "<!-- DOCGEN:START -->" "$readme"; then
                awk -v auto_file="$auto_tmp" '
                  /<!-- DOCGEN:START -->/ {
                    while ((getline line < auto_file) > 0) print line
                    skip=1; next
                  }
                  /<!-- DOCGEN:END -->/ { skip=0; next }
                  !skip { print }
                ' "$readme" > "${readme}.tmp" && mv "${readme}.tmp" "$readme"
                rm -f "$auto_tmp"
              else
                { cat "$auto_tmp"; echo ""; cat "$readme"; } > "${readme}.tmp" \
                  && mv "${readme}.tmp" "$readme"
                rm -f "$auto_tmp"
              fi
            fi
          }

          while IFS= read -r dir; do
            generate_index "$dir"
          done < <(find "$DOCS_DIR" -type d | sort -r)

          index_count="$(find "$DOCS_DIR" -type f -name 'README.md' | wc -l)"
          echo "Pass 2 done: ${index_count} index files generated"

      - name: Stage docs changes
        run: |
          set -euo pipefail
          git add docs/
          git rm -r --cached node_modules 2>/dev/null || true

      - name: Commit & push if there are changes
        run: |
          set -uo pipefail
          if git diff --cached --quiet; then
            echo "No docs changes to commit"
            exit 0
          fi

          git commit -m "auto:generated_doc [skip ci]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
