name: minifier

on:
  push:
    branches: ['**']
  workflow_call: {}

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:

      - name: Resolve ref
        id: ref
        shell: bash
        env:
          MULTIPLE_PACKAGES: ${{ vars.MULTIPLE_PACKAGES }}
        run: |
          set -euo pipefail

          # >>> .github/snippets/resolve-ref.sh
          __lower() { printf '%s' "${1:-}" | tr -d '\r' | tr '[:upper:]' '[:lower:]'; }
          __trim()  { printf '%s' "${1:-}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          __slug()  { printf '%s' "${1:-}" | tr -d '\r' | tr '/' '-'; }
          __fail()  { echo "::error::$1" >&2; exit 1; }

          MULTIPLE_PACKAGES="$(__lower "$(__trim "${MULTIPLE_PACKAGES:-}")")"

          __event="${GITHUB_EVENT_NAME:-}"
          __raw_type="$(__trim "${GITHUB_REF_TYPE:-}")"
          __raw_name="$(__trim "${GITHUB_REF_NAME:-}")"

          REF_TYPE=""
          REF_NAME="$__raw_name"
          REF_NAME_NORM=""
          REF_BRANCH=""
          REF_COMMIT="$(__trim "${GITHUB_SHA:-}")"
          REF_TAG=""
          REF_TAG_BRANCH=""

          case "$__event" in
            pull_request|pull_request_target)
              REF_TYPE="pr"
              __pr="$(__trim "${PR_NUMBER:-}")"
              if [ -z "$__pr" ]; then __pr="${__raw_name%%/*}"; fi
              REF_NAME_NORM="pr-${__pr}"
              REF_BRANCH="$(__slug "${PR_BASE_REF:-}")"
              __head="$(__trim "${PR_HEAD_SHA:-}")"
              if [ -n "$__head" ]; then REF_COMMIT="$__head"; fi
              ;;

            *)
              if [ "$__raw_type" = "tag" ]; then
                REF_TYPE="tag"

                __prefix=""
                __vpart="$__raw_name"
                if [ "${__raw_name#*/}" != "$__raw_name" ]; then
                  __prefix="${__raw_name%/*}"
                  __vpart="${__raw_name##*/}"
                fi

                if ! printf '%s' "$__vpart" | grep -qE '^v[0-9]+(\.[0-9]+)*$'; then
                  __fail "Tag '$__vpart' is not a v-version tag (expected v#, v#.#, v#.#.#)."
                fi
                if [ "$MULTIPLE_PACKAGES" = "true" ] && [ -z "$__prefix" ]; then
                  __fail "MULTIPLE_PACKAGES=true: the tag must have the form '{branch}/vX.Y.Z' (got '$__raw_name')."
                fi
                if [ "$MULTIPLE_PACKAGES" != "true" ] && [ -n "$__prefix" ]; then
                  __fail "MULTIPLE_PACKAGES is off: the tag must have the form 'vX.Y.Z' without a branch prefix (got '$__raw_name'). Set MULTIPLE_PACKAGES=true to use '{branch}/vX.Y.Z' tags."
                fi

                REF_TAG="$__vpart"
                REF_TAG_BRANCH="$__prefix"
                REF_BRANCH="$(__slug "$__prefix")"
                if [ -n "$__prefix" ]; then
                  REF_NAME_NORM="${REF_BRANCH}-${__vpart#v}"
                else
                  REF_NAME_NORM="${__vpart#v}"
                fi
              else
                REF_TYPE="branch"
                REF_BRANCH="$(__slug "$__raw_name")"
                REF_NAME_NORM="$REF_BRANCH"
              fi
              ;;
          esac

          if [ -z "$REF_NAME" ]; then __fail "Cannot determine what was pushed: GITHUB_REF_NAME is empty."; fi
          if [ -z "$REF_COMMIT" ]; then __fail "Cannot determine the commit: GITHUB_SHA is empty."; fi

          echo "ref_type=$REF_TYPE ref_name=$REF_NAME ref_name_norm=$REF_NAME_NORM ref_branch=${REF_BRANCH:-<by history>} ref_commit=$REF_COMMIT"

          {
            echo "ref_type=$REF_TYPE"
            echo "ref_name=$REF_NAME"
            echo "ref_name_norm=$REF_NAME_NORM"
            echo "ref_branch=$REF_BRANCH"
            echo "ref_commit=$REF_COMMIT"
            echo "ref_tag=$REF_TAG"
            echo "ref_tag_branch=$REF_TAG_BRANCH"
          } >> "$GITHUB_OUTPUT"

          {
            echo "REF_TYPE=$REF_TYPE"
            echo "REF_NAME=$REF_NAME"
            echo "REF_NAME_NORM=$REF_NAME_NORM"
            echo "REF_BRANCH=$REF_BRANCH"
            echo "REF_COMMIT=$REF_COMMIT"
          } >> "$GITHUB_ENV"

          unset -f __lower __trim __slug __fail
          unset __event __raw_type __raw_name __pr __head __prefix __vpart
          # <<< .github/snippets/resolve-ref.sh

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git user for commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install latest minifiers
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-save csso-cli terser@latest

      - name: Find and minify .css & .js
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          PARALLEL=$(nproc 2>/dev/null || echo 2)

          CSSO="./node_modules/.bin/csso"
          TERSER="./node_modules/.bin/terser"

          if [ ! -x "${CSSO}" ]; then
            echo "Error: csso not found at ${CSSO}"
            exit 2
          fi

          if [ ! -x "${TERSER}" ]; then
            echo "Error: terser not found at ${TERSER}"
            exit 2
          fi

          EXCLUDE_PATHS=(
            './node_modules'
            './vendor'
            './dist'
            './build'
            './bower_components'
          )

          FIND_EXCLUDES=( -path '*/.*' -prune -o )
          for p in "${EXCLUDE_PATHS[@]}"; do
            FIND_EXCLUDES+=( -path "${p}/*" -prune -o )
          done

          find . "${FIND_EXCLUDES[@]}" -type f \( -iname '*.css' -o -iname '*.js' \) ! -iname '*.min.*' -print0 \
            | xargs -0 -P "$PARALLEL" -I{} bash -c '
                f="$1"
                pf="${f#./}"
                case "$f" in
                  *.css|*.CSS)
                    out="${f%.*}.min.css"
                    printf "[css] %s -> %s\n" "$pf" "${out#./}"
                    if '"${CSSO}"' "$f" --output "$out"; then
                      :
                    else
                      printf "ERROR minifying css: %s\n" "$pf" >&2
                      exit 1
                    fi
                    ;;
                  *.js|*.JS)
                    out="${f%.*}.min.js"
                    printf "[js]  %s -> %s\n" "$pf" "${out#./}"
                    if '"${TERSER}"' "$f" -o "$out" --compress --mangle; then
                      :
                    else
                      printf "ERROR minifying js: %s\n" "$pf" >&2
                      exit 1
                    fi
                    ;;
                  *)
                    ;;
                esac
              ' _ {}

      - name: Stage only minified files for commit
        run: |
          set -euo pipefail
          find . -type f \( -iname '*.min.css' -o -iname '*.min.js' \) \
            ! -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty git add --
          git rm -r --cached node_modules || true

      - name: Commit & push if there are changes
        run: |
          set -uo pipefail

          if [ "$REF_TYPE" != "branch" ]; then
            echo "::notice::$REF_TYPE '$REF_NAME' — пуш делается только в ветку, изменения не коммитятся."
            exit 0
          fi

          if git diff --cached --quiet; then
            echo "No minified changes to commit"
            exit 0
          fi

          git commit -m "auto:minify [skip ci]"

          git push origin "HEAD:$REF_NAME"
