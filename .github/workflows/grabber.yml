name: grabber

on:
  workflow_dispatch:
    inputs:
      commits:
        description: 'Comma-separated commits to grab files from'
        required: false
        type: string
        default: ''
      deploy_mirror:
        description: 'Keep all:false; delete files removed on server:true;'
        required: false
        type: string
        default: 'false'
  workflow_call:
    inputs:
      commits:
        description: 'Comma-separated commits to grab files from'
        required: false
        type: string
        default: ''
      deploy_mirror:
        description: 'Keep all:false; delete files removed on server:true;'
        required: false
        type: string
        default: 'false'
    secrets:
      DEPLOY_KEY:
        required: false

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name }}

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_LOCAL_DIR: ${{ vars.DEPLOY_LOCAL_DIR || './' }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      COMMITS: ${{ inputs.commits || '' }}

    steps:
      - name: Normalize config
        shell: bash
        env:
          DEPLOY_METHOD_RAW: ${{ vars.DEPLOY_METHOD }}
          DEPLOY_MIRROR_RAW: ${{ inputs.deploy_mirror || 'false' }}
        run: |
          set -euo pipefail

          lower() { printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]'; }
          DEPLOY_METHOD="$(lower "$DEPLOY_METHOD_RAW")"
          DEPLOY_MIRROR="$(lower "$DEPLOY_MIRROR_RAW")"

          case "$DEPLOY_METHOD" in
            rsync|ftp) ;;
            *)
              echo "::error::grabber supports only DEPLOY_METHOD=rsync | ftp (got '$DEPLOY_METHOD'). Downloading from the server has no meaning for command or git." >&2
              exit 1
              ;;
          esac

          echo "method=$DEPLOY_METHOD mirror=$DEPLOY_MIRROR"
          {
            echo "DEPLOY_METHOD=$DEPLOY_METHOD"
            echo "DEPLOY_MIRROR=$DEPLOY_MIRROR"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        shell: bash
        run: |
          git config core.fileMode false
          git config core.autocrlf false
          git config core.quotepath false

      - name: Resolve REF_COMMIT
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$COMMITS" ]; then
            REF_COMMIT=$(git rev-parse HEAD)
            echo "No commits specified — REF_COMMIT = HEAD = $REF_COMMIT"
          else
            readarray -t COMMITS_ARR < <(echo "$COMMITS" | tr ',; \t\r\n' '\n' | tr -s '\n' | grep -v '^[[:space:]]*$')
            REF_COMMIT=$(git log --no-walk --format='%ct %H' "${COMMITS_ARR[@]}" | sort -k1 -nr | head -1 | awk '{print $2}')
            echo "Resolved REF_COMMIT (latest by committer-date) = $REF_COMMIT"

            if [ "${#COMMITS_ARR[@]}" -eq 1 ]; then
              MERGE_BASE="${COMMITS_ARR[0]}"
            else
              MERGE_BASE=$(git merge-base --octopus "${COMMITS_ARR[@]}")
            fi
            if BASE_COMMIT=$(git rev-parse --verify --quiet "${MERGE_BASE}^"); then
              echo "BASE_COMMIT (parent of merge-base $MERGE_BASE) = $BASE_COMMIT"
              echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"
            else
              echo "::warning::Cannot resolve parent of $MERGE_BASE (root commit?) — sync branch will fall back to HEAD"
            fi
          fi

          echo "REF_COMMIT=$REF_COMMIT" >> "$GITHUB_ENV"

      - name: Resolve commits files
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$COMMITS" ]; then
            echo "COMMITS_MODE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "COMMITS_MODE=true" >> "$GITHUB_ENV"

          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""
          echo "LOCAL_DIR=$LOCAL_DIR" >> "$GITHUB_ENV"

          TO_DOWNLOAD="$RUNNER_TEMP/to_download.txt"
          ALL_FILES="$RUNNER_TEMP/all_files.txt"
          > "$TO_DOWNLOAD"
          > "$ALL_FILES"

          readarray -t COMMITS_ARR < <(echo "$COMMITS" | tr ',; \t\r\n' '\n' | tr -s '\n' | grep -v '^[[:space:]]*$')

          for commit in "${COMMITS_ARR[@]}"; do
            commit="${commit// /}"
            [ -z "$commit" ] && continue
            echo "=== Processing commit: $commit ==="
            git diff-tree --no-commit-id -r --name-only "$commit" >> "$ALL_FILES"
          done

          grep -vE '^\.git' "$ALL_FILES" > "$ALL_FILES.tmp" && mv "$ALL_FILES.tmp" "$ALL_FILES"

          sort -u -o "$ALL_FILES" "$ALL_FILES"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -z "$LOCAL_DIR" ]; then
              if git cat-file -e "$REF_COMMIT:$file" 2>/dev/null; then
                echo "$file" >> "$TO_DOWNLOAD"
              else
                echo "::warning::Skipping '$file': not present at REF_COMMIT $REF_COMMIT"
              fi
            elif [[ "$file" == "$LOCAL_DIR/"* ]]; then
              stripped="${file#"$LOCAL_DIR/"}"
              if git cat-file -e "$REF_COMMIT:$file" 2>/dev/null; then
                echo "$stripped" >> "$TO_DOWNLOAD"
              else
                echo "::warning::Skipping '$file': not present at REF_COMMIT $REF_COMMIT"
              fi
            fi
          done < "$ALL_FILES"

          sort -u -o "$TO_DOWNLOAD" "$TO_DOWNLOAD"
          cp "$TO_DOWNLOAD" "$RUNNER_TEMP/commits_original.txt"

          echo "=== Files from commits (alive at REF_COMMIT): $(wc -l < "$TO_DOWNLOAD") ==="

          if ! [ -s "$TO_DOWNLOAD" ]; then
            echo "::warning::No files found in the specified commits"
            echo "NOTHING_TO_SYNC=true" >> "$GITHUB_ENV"
          fi

      - name: Setup ssh key
        if: ${{ env.DEPLOY_METHOD == 'rsync' }}
        shell: bash
        run: |
          TMP_KEY=$(mktemp)
          echo "$DEPLOY_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"
          echo "TMP_KEY=$TMP_KEY" >> "$GITHUB_ENV"

      - name: Cache lftp
        if: ${{ env.DEPLOY_METHOD == 'ftp' }}
        id: cache-lftp
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-lftp-v2

      - name: Keep apt packages for caching
        if: ${{ env.DEPLOY_METHOD == 'ftp' }}
        shell: bash
        run: echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-cache >/dev/null

      - name: Install lftp
        if: ${{ env.DEPLOY_METHOD == 'ftp' }}
        shell: bash
        run: |
          if [ "${{ steps.cache-lftp.outputs.cache-hit }}" = "true" ] && ls /var/cache/apt/archives/lftp_*.deb &>/dev/null; then
            sudo dpkg -i /var/cache/apt/archives/lftp_*.deb || sudo apt-get install -f -y --no-install-recommends
          else
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends lftp
          fi

      - name: List server files
        shell: bash
        run: |
          set -euo pipefail

          if [ "$COMMITS_MODE" = "true" ]; then
            TO_DOWNLOAD="$RUNNER_TEMP/to_download.txt"
            SERVER_FILES="$RUNNER_TEMP/server_files.txt"
            > "$SERVER_FILES"
            DEPLOY_PATH_STRIPPED="${DEPLOY_PATH%/}"

            if [ "$DEPLOY_METHOD" = "rsync" ]; then
              ssh -i "$TMP_KEY" \
                -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
                -p "$DEPLOY_PORT" \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                "while IFS= read -r f; do test -f \"${DEPLOY_PATH_STRIPPED}/\$f\" && echo \"\$f\"; done" \
                < "$TO_DOWNLOAD" > "$SERVER_FILES"

            elif [ "$DEPLOY_METHOD" = "ftp" ]; then
              cp "$TO_DOWNLOAD" "$SERVER_FILES"
            fi

            cp "$SERVER_FILES" "$TO_DOWNLOAD"
            echo "=== Files from commits found on server: $(wc -l < "$SERVER_FILES") ==="
            exit 0
          fi

          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""
          echo "LOCAL_DIR=$LOCAL_DIR" >> "$GITHUB_ENV"

          SERVER_FILES="$RUNNER_TEMP/server_files.txt"

          if [ "$DEPLOY_METHOD" = "rsync" ]; then
            ssh -i "$TMP_KEY" \
              -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "find -L '$DEPLOY_PATH' -type f -printf '%P\n'" \
              | grep -vE '^\.git' > "$SERVER_FILES"

          elif [ "$DEPLOY_METHOD" = "ftp" ]; then
            touch "$RUNNER_TEMP/server_files_raw.txt"
            lftp -u "$DEPLOY_USER,$DEPLOY_KEY" -p "$DEPLOY_PORT" "$DEPLOY_HOST" <<LFTP > "$RUNNER_TEMP/server_files_raw.txt" &
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set cmd:fail-exit true
          find $DEPLOY_PATH
          quit
          LFTP
            LFTP_PID=$!
            echo "=== Listing files on FTP server (progress every 15s) ==="
            while kill -0 "$LFTP_PID" 2>/dev/null; do
              sleep 15
              COUNT=$(wc -l < "$RUNNER_TEMP/server_files_raw.txt" 2>/dev/null || echo 0)
              echo "  ... ${COUNT} files listed so far"
            done
            wait "$LFTP_PID"
            DEPLOY_PATH_STRIPPED="${DEPLOY_PATH%/}"
            sed "s|^${DEPLOY_PATH_STRIPPED}/||" "$RUNNER_TEMP/server_files_raw.txt" \
              | grep -vE '^$|^\.git' > "$SERVER_FILES"
          fi

          echo "=== Total files on server: $(wc -l < "$SERVER_FILES") ==="

      - name: Filter files via .gitignore
        shell: bash
        run: |
          set -euo pipefail

          SERVER_FILES="$RUNNER_TEMP/server_files.txt"
          FILTERED_FILES="$RUNNER_TEMP/to_download.txt"
          IGNORED_FILES="$RUNNER_TEMP/ignored.txt"

          if [ -n "$LOCAL_DIR" ]; then
            sed "s|^|$LOCAL_DIR/|" "$SERVER_FILES" > "$RUNNER_TEMP/server_files_prefixed.txt"
          else
            cp "$SERVER_FILES" "$RUNNER_TEMP/server_files_prefixed.txt"
          fi

          git check-ignore --stdin < "$RUNNER_TEMP/server_files_prefixed.txt" > "$IGNORED_FILES" 2>/dev/null || true

          comm -23 \
            <(sort "$RUNNER_TEMP/server_files_prefixed.txt") \
            <(sort "$IGNORED_FILES") \
            | if [ -n "$LOCAL_DIR" ]; then
                sed "s|^$LOCAL_DIR/||"
              else
                cat
              fi \
            > "$FILTERED_FILES"

          TOTAL=$(wc -l < "$SERVER_FILES")
          IGNORED=$(wc -l < "$IGNORED_FILES")
          TO_DOWNLOAD=$(wc -l < "$FILTERED_FILES")

          echo "=== Server files:  $TOTAL ==="
          echo "=== Ignored:       $IGNORED ==="
          echo "=== To download:   $TO_DOWNLOAD ==="

          if ! [ -s "$FILTERED_FILES" ]; then
            if [ "$COMMITS_MODE" = "true" ] && [ "${DEPLOY_MIRROR}" = "true" ] && [ -s "$RUNNER_TEMP/commits_original.txt" ]; then
              echo "::warning::No files to download from server, but will apply mirror deletions"
            else
              echo "::warning::No files to download after applying .gitignore filter"
              echo "NOTHING_TO_SYNC=true" >> "$GITHUB_ENV"
            fi
          fi

      - name: FTP Download
        if: ${{ env.DEPLOY_METHOD == 'ftp' && env.NOTHING_TO_SYNC != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          FILTERED_FILES="$RUNNER_TEMP/to_download.txt"

          if [ -n "$LOCAL_DIR" ]; then
            DEST_DIR="./$LOCAL_DIR"
          else
            DEST_DIR="./"
          fi

          DEPLOY_PATH_STRIPPED="${DEPLOY_PATH%/}"

          {
            echo "set net:timeout 15"
            echo "set net:max-retries 2"
            echo "set net:reconnect-interval-base 2"
            echo "set net:reconnect-interval-multiplier 1"
            echo "set ftp:passive-mode true"
            echo "set ssl:verify-certificate no"
            echo "set xfer:clobber true"

            if [ "$COMMITS_MODE" = "true" ]; then
              echo "set cmd:fail-exit false"
            else
              echo "set cmd:fail-exit true"
            fi

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              local_dir=$(dirname "$DEST_DIR/$file")
              echo "mkdir -fp \"$local_dir\""
              echo "get -O \"$local_dir\" \"$DEPLOY_PATH_STRIPPED/$file\""
            done < "$FILTERED_FILES"

            echo "quit"
          } | lftp -u "$DEPLOY_USER,$DEPLOY_KEY" -p "$DEPLOY_PORT" "$DEPLOY_HOST"

          if [ "$COMMITS_MODE" = "true" ]; then
            > "$RUNNER_TEMP/server_files.txt"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [ -n "$LOCAL_DIR" ]; then
                local_path="./$LOCAL_DIR/$file"
              else
                local_path="./$file"
              fi
              [ -f "$local_path" ] && echo "$file" >> "$RUNNER_TEMP/server_files.txt"
            done < "$RUNNER_TEMP/commits_original.txt"
            echo "=== Files actually downloaded from server: $(wc -l < "$RUNNER_TEMP/server_files.txt") ==="
          fi

          if [ "${DEPLOY_MIRROR}" = "true" ]; then
            if [ "$COMMITS_MODE" != "true" ]; then
              SERVER_FILES="$RUNNER_TEMP/server_files.txt"
              git ls-files | while IFS= read -r tracked; do
                if [ -n "$LOCAL_DIR" ]; then
                  if [[ "$tracked" == "$LOCAL_DIR/"* ]]; then
                    rel="${tracked#"$LOCAL_DIR/"}"
                  else
                    continue
                  fi
                else
                  rel="$tracked"
                fi
                if ! grep -qxF "$rel" "$SERVER_FILES"; then
                  echo "Removing: $tracked"
                  rm -f "$tracked"
                fi
              done
            fi
          fi

      - name: RSYNC Download
        if: ${{ env.DEPLOY_METHOD == 'rsync' && env.NOTHING_TO_SYNC != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          FILTERED_FILES="$RUNNER_TEMP/to_download.txt"

          if [ -n "$LOCAL_DIR" ]; then
            DEST_DIR="./$LOCAL_DIR/"
          else
            DEST_DIR="./"
          fi

          rsync -avz --progress \
            -e "ssh -i $TMP_KEY -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p $DEPLOY_PORT" \
            --files-from="$FILTERED_FILES" \
            --ignore-missing-args \
            --no-perms --no-owner --no-group \
            --copy-links \
            "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}/" "$DEST_DIR"

          if [ "${DEPLOY_MIRROR}" = "true" ]; then
            if [ "$COMMITS_MODE" != "true" ]; then
              SERVER_FILES="$RUNNER_TEMP/server_files.txt"
              git ls-files | while IFS= read -r tracked; do
                if [ -n "$LOCAL_DIR" ]; then
                  if [[ "$tracked" == "$LOCAL_DIR/"* ]]; then
                    rel="${tracked#"$LOCAL_DIR/"}"
                  else
                    continue
                  fi
                else
                  rel="$tracked"
                fi
                if ! grep -qxF "$rel" "$SERVER_FILES"; then
                  echo "Removing: $tracked"
                  rm -f "$tracked"
                fi
              done
            fi
          fi

      - name: Commit and push
        if: ${{ env.NOTHING_TO_SYNC != 'true' }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u +%Y-%m-%d_%H-%M-%S)
          BRANCH="sync/${GITHUB_REF_NAME}_${TIMESTAMP}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.fileMode false
          git config core.autocrlf false
          git config core.quotepath false

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ "$COMMITS_MODE" = "true" ] && [ -n "${BASE_COMMIT:-}" ]; then
            PAYLOAD="$RUNNER_TEMP/payload"
            rm -rf "$PAYLOAD"; mkdir -p "$PAYLOAD"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [ -n "$LOCAL_DIR" ]; then rel="$LOCAL_DIR/$file"; else rel="$file"; fi
              [ -f "./$rel" ] || continue
              mkdir -p "$PAYLOAD/$(dirname "$rel")"
              cp "./$rel" "$PAYLOAD/$rel"
            done < "$RUNNER_TEMP/server_files.txt"

            git checkout -f -B "$BRANCH" "$BASE_COMMIT"

            if [ -d "$PAYLOAD" ]; then
              (cd "$PAYLOAD" && find . -type f) | while IFS= read -r p; do
                p="${p#./}"
                mkdir -p "$(dirname "./$p")"
                cp "$PAYLOAD/$p" "./$p"
              done
            fi

            if [ "${DEPLOY_MIRROR}" = "true" ]; then
              comm -23 <(sort "$RUNNER_TEMP/commits_original.txt") <(sort "$RUNNER_TEMP/server_files.txt") \
                | while IFS= read -r file; do
                    [ -z "$file" ] && continue
                    if [ -n "$LOCAL_DIR" ]; then lp="./$LOCAL_DIR/$file"; else lp="./$file"; fi
                    [ -f "$lp" ] && { echo "Removing: $lp"; rm -f "$lp"; }
                  done
            fi
          else
            git checkout -b "$BRANCH"
          fi
          git add -A

          git reset -q -- .git .github .gitignore .gitattributes .gitmodules 2>/dev/null || true

          git diff --cached --name-only -z --diff-filter=M | while IFS= read -r -d '' f; do
            if git diff --cached --ignore-cr-at-eol --quiet -- "$f"; then
              git restore --staged "$f"
              echo "Unstaged (CRLF-only diff): $f"
            fi
          done

          if git diff --cached --quiet; then
            echo "::warning::No changes detected after download — nothing to commit"
            exit 0
          fi

          COMMIT_MSG="sync: import from server $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"

          echo "=== Branch pushed: $BRANCH ==="

      - name: Cleanup ssh key
        if: always()
        shell: bash
        run: |
          [ -n "${TMP_KEY:-}" ] && [ -f "$TMP_KEY" ] && rm -f "$TMP_KEY" || true
